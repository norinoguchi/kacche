<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Discovery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slateDark: '#0b0f19',
                        slateCard: '#131c2e',
                        accentBlue: '#3b82f6',
                        accentGold: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <!-- Inter & Noto Sans JP Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #131c2e !important;
            color: #f8fafa !important;
            border: 1px solid #1e293b;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .leaflet-container { font-family: 'Noto Sans JP', sans-serif; }
        .leaflet-popup-close-button { color: #94a3b8 !important; }
        .leaflet-popup-close-button:hover { color: #ffffff !important; }
        
        /* 地図コントロール（ズーム＆全表示リセット）のエレガント共通デザイン */
        .leaflet-touch .leaflet-bar, .leaflet-bar {
            border: none !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3) !important;
            border-radius: 0.875rem !important; /* rounded-xl */
            overflow: hidden;
            background-color: rgba(19, 28, 46, 0.85) !important;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(51, 65, 85, 0.8) !important;
        }

        .leaflet-touch .leaflet-bar a, .leaflet-bar a {
            background-color: transparent !important;
            color: #94a3b8 !important;
            border-bottom: 1px solid rgba(51, 65, 85, 0.6) !important;
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: all 0.2s ease !important;
            font-size: 16px !important;
            font-weight: 500 !important;
            text-decoration: none !important;
        }

        .leaflet-touch .leaflet-bar a:last-child, .leaflet-bar a:last-child {
            border-bottom: none !important;
        }

        .leaflet-touch .leaflet-bar a:hover, .leaflet-bar a:hover {
            background-color: rgba(30, 41, 59, 0.9) !important;
            color: #ffffff !important;
        }

        .leaflet-touch .leaflet-bar a:active, .leaflet-bar a:active {
            background-color: rgba(59, 130, 246, 0.2) !important;
            color: #60a5fa !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slateDark text-slate-100 h-full flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slateCard/80 backdrop-blur-md border-b border-slate-800 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    Japan Discovery
                    <span class="hidden sm:inline-block text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-normal">Pro Platform</span>
                </h1>
                <p id="txt-subtitle" class="text-[11px] sm:text-xs text-slate-400">日本文化イベントデータベース</p>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Language Selector -->
            <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 sm:px-3 py-1.5 sm:py-2 text-xs text-white focus:outline-none focus:border-blue-500 cursor-pointer">
                <option value="ja">🇯🇵 日本語</option>
                <option value="en">🇺🇸 English</option>
                <option value="zh-TW">🇹🇼 繁體中文</option>
                <option value="zh-CN">🇨🇳 简体中文</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="th">🇹🇭 ไทย</option>
                <option value="id">🇮🇩 Bahasa Indonesia</option>
            </select>
        </div>
    </header>

    <!-- Main Toolbar & Navigation -->
    <div class="bg-slateCard/40 border-b border-slate-800 px-4 sm:px-6 py-3 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 shrink-0 z-10">
        <div class="flex flex-wrap items-center justify-between gap-2">
            <!-- View Mode Switcher -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button onclick="switchView('map')" id="btn-view-map" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 sm:gap-2 bg-blue-600 text-white shadow-md">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    <span id="txt-nav-map">マップ</span>
                </button>
                <button onclick="switchView('list')" id="btn-view-list" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 sm:gap-2 text-slate-400 hover:text-white">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    <span id="txt-nav-list">リスト</span>
                </button>
                <button onclick="switchView('calendar')" id="btn-view-calendar" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 sm:gap-2 text-slate-400 hover:text-white">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="txt-nav-calendar">カレンダー</span>
                </button>
            </div>

            <!-- Category Filters -->
            <div class="flex items-center gap-1.5">
                <button onclick="filterCategory('all')" id="cat-all" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-blue-600 text-white shadow-sm">すべて</button>
                <button onclick="filterCategory('matsuri')" id="cat-matsuri" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700">⛩️ 祭り</button>
                <button onclick="filterCategory('fireworks')" id="cat-fireworks" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700">🎆 花火</button>
                <button onclick="filterCategory('craft')" id="cat-craft" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700">🪭 工芸</button>
                <button onclick="filterCategory('food')" id="cat-food" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700">🍣 食</button>
            </div>
        </div>

        <!-- Search Box -->
        <div class="relative w-full md:w-64">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="地域名やキーワードで検索..." class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl pl-9 pr-4 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all">
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden flex">
        <!-- 1. Map View Container -->
        <div id="view-map" class="absolute inset-0 flex">
            <div id="map" class="w-full h-full z-0"></div>
        </div>

        <!-- 2. List View Container -->
        <div id="view-list" class="absolute inset-0 bg-slateDark overflow-y-auto p-4 sm:p-6 hidden">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-base sm:text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <span id="txt-list-title">開催期間・日付順リスト</span>
                    <span class="text-xs font-normal text-slate-400" id="listCount">（0件）</span>
                </h2>
                <div id="listContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>

        <!-- 3. Calendar View Container -->
        <div id="view-calendar" class="absolute inset-0 bg-slateDark overflow-y-auto p-4 sm:p-6 hidden">
            <div class="max-w-5xl mx-auto">
                <div class="flex items-center justify-between mb-6 bg-slateCard/60 border border-slate-800 px-4 sm:px-6 py-3 sm:py-4 rounded-2xl">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 id="calendarMonthTitle" class="text-base sm:text-lg font-bold text-white">2026年 8月</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>

                <div class="bg-slateCard/40 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div id="calendarHeaders" class="grid grid-cols-7 bg-slate-900/90 text-center text-xs font-semibold text-slate-400 py-3 border-b border-slate-800">
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 bg-slate-800/20 gap-px"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div id="modalContent" class="p-5 sm:p-6 overflow-y-auto flex-1 space-y-5"></div>
            <div class="bg-slate-900/60 px-5 sm:px-6 py-3.5 border-t border-slate-800 flex justify-end gap-3 shrink-0">
                <button onclick="closeDetailModal()" id="txt-close" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 画像拡大・スライドショー用ライトボックスモーダル -->
    <div id="imageLightboxModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 hidden">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white/70 hover:text-white p-2.5 rounded-full bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 transition-all z-20" title="閉じる (Esc)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <div class="relative max-w-5xl max-h-[80vh] w-full flex items-center justify-center">
            <button id="lightboxPrevBtn" onclick="prevLightboxImage()" class="absolute left-2 sm:left-4 text-white bg-slate-900/70 hover:bg-slate-900 p-3 rounded-full backdrop-blur-sm border border-slate-700/60 transition-all z-10 hover:scale-105" title="前の写真 (←)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>

            <img id="lightboxImage" src="" alt="" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl border border-slate-800">

            <button id="lightboxNextBtn" onclick="nextLightboxImage()" class="absolute right-2 sm:right-4 text-white bg-slate-900/70 hover:bg-slate-900 p-3 rounded-full backdrop-blur-sm border border-slate-700/60 transition-all z-10 hover:scale-105" title="次の写真 (→)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <div class="mt-4 text-center max-w-xl">
            <p id="lightboxCaption" class="text-white text-sm font-medium mb-1"></p>
            <p id="lightboxCounter" class="text-xs text-slate-400 font-mono"></p>
        </div>
    </div>

                photosTitle: "📸 แกลเลอรี่รูปภาพ (คลิกเพื่อขยาย)",
                linksTitle: "🔗 ลิงก์ที่เกี่ยวข้อง",
                weekdays: ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"],
                formatMonth: (y, m) => `${m}/${y}`
            },
            id: {
                subtitle: "Database Acara Kebudayaan Jepang",
                navMap: "Peta",
                navList: "Daftar",
                navCalendar: "Kalender",
                catAll: "Semua",
                catMatsuri: "⛩️ Festival",
                catFireworks: "🎆 Kembang Api",
                catCraft: "🪭 Kerajinan",
                catFood: "🍣 Kuliner",
                searchPlaceholder: "Cari lokasi...",
                listTitle: "Daftar Urut Tanggal",
                noResult: "Tidak ada tempat atau acara yang ditemukan.",
                detailLink: "Detail & Konsultasi",
                consultTitle: "Konsultasi Kunjungan & Pengaturan",
                consultDesc: "Pertanyaan untuk pengaturan perjalanan, pemandu lokal, atau konsultasi",
                consultBtn: "Konsultasi",
                close: "Tutup",
                photosTitle: "📸 Galeri Foto (Klik untuk memperbesar)",
                linksTitle: "🔗 Tautan Terkait",
                weekdays: ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"],
                formatMonth: (y, m) => {
                    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                    return `${months[m - 1]} ${y}`;
                }
            }
        };

        let spots = [];
        let spotContentI18n = {};
        let currentLang = 'ja';

        let currentLightboxPhotos = [];
        let currentLightboxIndex = 0;

        const defaultSpots = [
            { id: 1, category: 'fireworks', startDate: '2026-08-02', endDate: '2026-08-03', lat: 37.4475, lng: 138.8511, photos: [{ url: "nagaoka.jpg", caption: "夜空を彩る大花火" }], links: [{ url: "https://nagaokamatsuri.com", text: "長岡まつり公式ウェブサイト" }] },
            { id: 2, category: 'fireworks', startDate: '2026-08-29', endDate: '2026-08-29', lat: 39.4542, lng: 140.4731, photos: [], links: [] },
            { id: 3, category: 'matsuri', startDate: '2026-07-17', endDate: '2026-07-17', lat: 35.0037, lng: 135.7600, photos: [], links: [] },
            { id: 4, category: 'food', startDate: '2026-08-10', endDate: '2026-08-12', lat: 36.2560, lng: 136.9066, photos: [], links: [] },
            { id: 5, category: 'matsuri', startDate: '2026-09-15', endDate: '2026-09-15', lat: 33.7042, lng: 135.7765, photos: [], links: [] },
            { id: 6, category: 'craft', startDate: '2026-10-10', endDate: '2026-10-12', lat: 35.6762, lng: 139.6503, photos: [], links: [] }
        ];

        const defaultI18n = {
            1: {
                ja: { title: "長岡まつり大花火大会", location: "新潟県長岡市", desc: "日本三大花火の一つ。信濃川を舞台に圧倒的なスケールで繰り広げられる正三尺玉やフェニックスは必見。" },
                en: { title: "Nagaoka Fireworks Festival", location: "Nagaoka City, Niigata", desc: "One of Japan's top three fireworks festivals." }
            }
        };

        let currentView = 'map';
        let currentCategory = 'all';
        let searchQuery = '';
        
        let todayObj = new Date();
        let currentCalendarDate = new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);

        let map, markersLayer;

        window.addEventListener('DOMContentLoaded', async () => {
            initMap();
            await loadData();
            changeLanguage('ja');
        });

        async function loadData() {
            try {
                const response = await fetch(`spot/spots_data.json?v=${Date.now()}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.spots && data.spotContentI18n) {
                        spots = data.spots;
                        spotContentI18n = data.spotContentI18n;
                        localStorage.setItem('japan_discovery_spots', JSON.stringify(spots));
                        localStorage.setItem('japan_discovery_spot_i18n', JSON.stringify(spotContentI18n));
                        return;
                    }
                }
            } catch (e) {
                console.log("spot/spots_data.json fetch error, falling back to localStorage...");
            }

            spots = JSON.parse(localStorage.getItem('japan_discovery_spots')) || defaultSpots;
            spotContentI18n = JSON.parse(localStorage.getItem('japan_discovery_spot_i18n')) || defaultI18n;
        }

        function buildPhotoUrl(urlRaw) {
            if (!urlRaw) return "";
            let u = String(urlRaw).trim();

            if (u.startsWith('http://') || u.startsWith('https://')) {
                return u;
            }

            if (u.startsWith('picture/')) {
                u = u.replace('picture/', '');
            }

            return `picture/${u}`;
        }

        function getLocalizedSpot(spot) {
            const spotI18n = spotContentI18n[spot.id] || {};
            const langData = spotI18n[currentLang] || spotI18n['ja'] || {};
            
            const processedPhotos = (spot.photos || []).map(p => {
                return {
                    ...p,
                    url: buildPhotoUrl(p.url)
                };
            });

            return {
                ...spot,
                category: spot.category === 'tourism' ? 'matsuri' : spot.category,
                startDate: spot.startDate || '2026-08-01',
                endDate: spot.endDate || spot.startDate || '2026-08-01',
                title: langData.title || '',
                location: langData.location || '',
                desc: langData.desc || '',
                photos: processedPhotos,
                links: spot.links || []
            };
        }

        function getCategoryDetails(cat) {
            const t = i18n[currentLang];
            if (cat === 'fireworks') {
                return {
                    label: t.catFireworks,
                    icon: '🎆',
                    badgeStyle: 'bg-rose-500/10 text-rose-400 border-rose-500/20',
                    mapStyle: 'bg-rose-500/20 border-rose-500 text-rose-400',
                    calStyle: 'bg-rose-500/15 text-rose-300 border-rose-500/20'
                };
            } else if (cat === 'craft') {
                return {
                    label: t.catCraft,
                    icon: '🪭',
                    badgeStyle: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20',
                    mapStyle: 'bg-indigo-500/20 border-indigo-500 text-indigo-400',
                    calStyle: 'bg-indigo-500/15 text-indigo-300 border-indigo-500/20'
                };
            } else if (cat === 'food') {
                return {
                    label: t.catFood,
                    icon: '🍣',
                    badgeStyle: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
                    mapStyle: 'bg-emerald-500/20 border-emerald-500 text-emerald-400',
                    calStyle: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/20'
                };
            } else { // matsuri (デフォルト)
                return {
                    label: t.catMatsuri,
                    icon: '⛩️',
                    badgeStyle: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    mapStyle: 'bg-amber-500/20 border-amber-500 text-amber-400',
                    calStyle: 'bg-amber-500/15 text-amber-300 border-amber-500/20'
                };
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];

            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-nav-map').innerText = t.navMap;
            document.getElementById('txt-nav-list').innerText = t.navList;
            document.getElementById('txt-nav-calendar').innerText = t.navCalendar;

            document.getElementById('cat-all').innerText = t.catAll;
            document.getElementById('cat-matsuri').innerText = t.catMatsuri;
            document.getElementById('cat-fireworks').innerText = t.catFireworks;
            document.getElementById('cat-craft').innerText = t.catCraft;
            document.getElementById('cat-food').innerText = t.catFood;

            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('txt-list-title').innerText = t.listTitle;
            document.getElementById('txt-close').innerText = t.close;

            const wd = t.weekdays;
            document.getElementById('calendarHeaders').innerHTML = `
                <div class="text-red-400">${wd[0]}</div>
                <div>${wd[1]}</div>
                <div>${wd[2]}</div>
                <div>${wd[3]}</div>
                <div>${wd[4]}</div>
                <div>${wd[5]}</div>
                <div class="text-blue-400">${wd[6]}</div>
            `;

            renderCurrentView();
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([37.5, 138.0], 6);

            // 統合コントロール（全表示リセット ＋ ズームイン ＋ ズームアウト）
            const CustomUnifiedControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function(mapInstance) {
                    const container = L.DomUtil.create('div', 'leaflet-bar');
                    L.DomEvent.disableClickPropagation(container);

                    // 1. 全体表示リセットボタン
                    const fitBtn = L.DomUtil.create('a', '', container);
                    fitBtn.href = '#';
                    fitBtn.title = '全体表示リセット';
                    fitBtn.role = 'button';
                    fitBtn.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                        </svg>
                    `;
                    L.DomEvent.on(fitBtn, 'click', function(e) {
                        L.DomEvent.stop(e);
                        fitMapToFilteredSpots();
                    });

                    // 2. ズームインボタン
                    const zoomInBtn = L.DomUtil.create('a', '', container);
                    zoomInBtn.href = '#';
                    zoomInBtn.title = '拡大';
                    zoomInBtn.role = 'button';
                    zoomInBtn.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                    `;
                    L.DomEvent.on(zoomInBtn, 'click', function(e) {
                        L.DomEvent.stop(e);
                        mapInstance.zoomIn();
                    });

                    // 3. ズームアウトボタン
                    const zoomOutBtn = L.DomUtil.create('a', '', container);
                    zoomOutBtn.href = '#';
                    zoomOutBtn.title = '縮小';
                    zoomOutBtn.role = 'button';
                    zoomOutBtn.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                        </svg>
                    `;
                    L.DomEvent.on(zoomOutBtn, 'click', function(e) {
                        L.DomEvent.stop(e);
                        mapInstance.zoomOut();
                    });

                    return container;
                }
            });

            map.addControl(new CustomUnifiedControl());

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        // 登録・フィルターされている全スポットが収まるように地図範囲を調整する関数
        function fitMapToFilteredSpots() {
            if (!map) return;
            const filtered = getFilteredSpots();
            if (filtered.length === 0) {
                map.setView([37.5, 138.0], 6);
                return;
            }

            const bounds = L.latLngBounds(filtered.map(s => [s.lat, s.lng]));
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
        }

        function updateMapMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            const filtered = getFilteredSpots();
            filtered.forEach(rawSpot => {
                const spot = getLocalizedSpot(rawSpot);
                const catMeta = getCategoryDetails(spot.category);
                
                const iconHtml = `
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center shadow-lg border ${catMeta.mapStyle} backdrop-blur-md">
                        ${catMeta.icon}
                    </div>
                `;
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: iconHtml,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
                marker.on('click', () => showDetailModal(spot.id));
                markersLayer.addLayer(marker);
            });

            // マーカー更新時にすべてのマーカーが入るよう自動ズーム調整
            fitMapToFilteredSpots();
        }

        function switchView(viewName) {
            currentView = viewName;
            ['map', 'list', 'calendar'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                const btn = document.getElementById(`btn-view-${v}`);
                if (v === viewName) {
                    el.classList.remove('hidden');
                    btn.className = "px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 sm:gap-2 bg-blue-600 text-white shadow-md";
                } else {
                    el.classList.add('hidden');
                    btn.className = "px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 sm:gap-2 text-slate-400 hover:text-white";
                }
            });

            if (viewName === 'map' && map) {
                setTimeout(() => {
                    map.invalidateSize();
                    fitMapToFilteredSpots();
                }, 100);
            }
            renderCurrentView();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            ['all', 'matsuri', 'fireworks', 'craft', 'food'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-blue-600 text-white shadow-sm";
                } else {
                    btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700";
                }
            });
            renderCurrentView();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderCurrentView();
        }

        function getFilteredSpots() {
            return spots.map(s => getLocalizedSpot(s)).filter(spot => {
                const matchCat = currentCategory === 'all' || spot.category === currentCategory;
                const matchQuery = (spot.title || '').toLowerCase().includes(searchQuery) || 
                                   (spot.location || '').toLowerCase().includes(searchQuery) || 
                                   (spot.desc || '').toLowerCase().includes(searchQuery);
                return matchCat && matchQuery;
            });
        }

        function renderCurrentView() {
            updateMapMarkers();
            if (currentView === 'list') renderListView();
            if (currentView === 'calendar') renderCalendarView();
        }

        function renderListView() {
            const container = document.getElementById('listContainer');
            const filtered = getFilteredSpots().sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
            const t = i18n[currentLang];
            document.getElementById('listCount').innerText = `（${filtered.length}件）`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">${t.noResult}</div>`;
                return;
            }

            container.innerHTML = filtered.map(spot => {
                const catMeta = getCategoryDetails(spot.category);
                const thumb = spot.photos && spot.photos.length > 0 ? spot.photos[0].url : null;
                const dateStr = spot.startDate === spot.endDate ? spot.startDate : `${spot.startDate} 〜 ${spot.endDate}`;
                return `
                    <div onclick="showDetailModal(${spot.id})" class="bg-slateCard/70 border border-slate-800/80 hover:border-slate-700 rounded-2xl p-4 sm:p-5 cursor-pointer transition-all hover:shadow-xl hover:shadow-blue-500/5 flex flex-col justify-between">
                        <div>
                            ${thumb ? `<div class="w-full h-36 rounded-xl mb-3 overflow-hidden bg-slate-900"><img src="${thumb}" class="w-full h-full object-cover" onerror="this.parentElement.style.display='none'"></div>` : ''}
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs px-2.5 py-1 rounded-lg font-medium border ${catMeta.badgeStyle}">
                                    ${catMeta.label}
                                </span>
                                <span class="text-xs font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">${dateStr}</span>
                            </div>
                            <h3 class="text-sm font-bold text-white mb-1.5">${spot.title || ''}</h3>
                            <p class="text-xs text-slate-400 flex items-center gap-1.5 mb-3">
                                <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                ${spot.location || ''}
                            </p>
                            <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${spot.desc || ''}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-blue-400 font-medium">
                            <span>${t.detailLink}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            renderCalendarView();
        }

        function renderCalendarView() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const t = i18n[currentLang];
            document.getElementById('calendarMonthTitle').innerText = t.formatMonth(year, month + 1);

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendarGrid');
            
            const filtered = getFilteredSpots();
            let html = '';

            for (let i = 0; i < firstDayIndex; i++) {
                html += `<div class="bg-slate-900/30 min-h-[90px] p-1.5 opacity-30"></div>`;
            }

            const todayY = todayObj.getFullYear();
            const todayM = todayObj.getMonth();
            const todayD = todayObj.getDate();

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const isToday = (year === todayY && month === todayM && day === todayD);

                const daySpots = filtered.filter(s => {
                    const start = s.startDate;
                    const end = s.endDate || start;
                    return dateKey >= start && dateKey <= end;
                });

                html += `
                    <div class="min-h-[100px] p-1.5 sm:p-2 flex flex-col transition-colors border ${isToday ? 'bg-blue-600/15 border-blue-500/50 shadow-inner' : 'bg-slateCard/60 hover:bg-slateCard border-slate-800/40'}">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[11px] sm:text-xs font-bold ${isToday ? 'text-blue-400 bg-blue-500/20 px-1.5 py-0.5 rounded-md' : 'text-slate-300'}">${day}</span>
                            ${daySpots.length > 0 ? `<span class="text-[9px] bg-blue-500/20 text-blue-400 px-1 py-0.5 rounded-full font-mono">${daySpots.length}</span>` : ''}
                        </div>
                        <div class="flex-1 space-y-1 overflow-y-auto max-h-[70px]">
                            ${daySpots.map(s => {
                                const catMeta = getCategoryDetails(s.category);
                                return `
                                    <div onclick="showDetailModal(${s.id})" class="text-[10px] sm:text-[11px] px-1.5 py-0.5 rounded-md truncate cursor-pointer transition-all border ${catMeta.calStyle}" title="${s.title}">
                                        ${catMeta.icon} ${s.title}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function showDetailModal(id) {
            const rawSpot = spots.find(s => Number(s.id) === Number(id));
            if (!rawSpot) return;
            const spot = getLocalizedSpot(rawSpot);
            const catMeta = getCategoryDetails(spot.category);
            const t = i18n[currentLang];
            const dateStr = spot.startDate === spot.endDate ? spot.startDate : `${spot.startDate} 〜 ${spot.endDate}`;

            let photosHtml = '';
            if (spot.photos && spot.photos.length > 0) {
                currentLightboxPhotos = spot.photos;
                photosHtml = `
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 mb-2">${t.photosTitle}</h4>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                            ${spot.photos.map((p, index) => `
                                <div onclick="openLightbox(${index})" class="group relative bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-amber-500/50 cursor-pointer transition-all">
                                    <div class="h-28 bg-slate-950">
                                        <img src="${p.url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.parentElement.style.display='none'">
                                    </div>
                                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <span class="text-xs text-white bg-slate-900/80 px-2 py-1 rounded-md border border-slate-700 flex items-center gap-1">
                                            🔍 拡大
                                        </span>
                                    </div>
                                    ${p.caption ? `<div class="p-1.5 text-[10px] text-slate-300 truncate bg-slate-900/90">${p.caption}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                currentLightboxPhotos = [];
            }

            let linksHtml = '';
            if (spot.links && spot.links.length > 0) {
                linksHtml = `
                    <div>
                        <h4 class="text-xs font-bold text-emerald-400 mb-2">${t.linksTitle}</h4>
                        <div class="space-y-1.5">
                            ${spot.links.map(l => `
                                <a href="${l.url}" target="_blank" class="flex items-center justify-between bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 p-2.5 rounded-xl text-xs text-blue-400 transition-all">
                                    <span class="truncate">${l.text || l.url}</span>
                                    <svg class="w-3.5 h-3.5 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('modalContent').innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs px-2.5 py-1 rounded-lg font-medium border ${catMeta.badgeStyle}">
                        ${catMeta.label}
                    </span>
                    <span class="text-xs font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">${dateStr}</span>
                </div>
                <h3 class="text-base font-bold text-white mb-2">${spot.title || ''}</h3>
                <p class="text-xs text-slate-400 flex items-center gap-1.5 mb-4">
                    <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    ${spot.location || ''}
                </p>
                <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800">
                    <p class="text-xs text-slate-300 leading-relaxed">${spot.desc || ''}</p>
                </div>
                ${photosHtml}
                ${linksHtml}
                <div class="bg-blue-600/10 border border-blue-500/30 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div>
                        <h4 class="text-xs font-bold text-blue-400 mb-0.5">${t.consultTitle}</h4>
                        <p class="text-[11px] text-slate-400">${t.consultDesc}</p>
                    </div>
                    <button onclick="alert('ご相談窓口へ接続します')" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl text-xs font-medium shadow-md transition-all shrink-0 w-full sm:w-auto text-center">
                        ${t.consultBtn}
                    </button>
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // --- 画像拡大・スライドショー（ライトボックス）機能 ---

        function openLightbox(index) {
            if (!currentLightboxPhotos || currentLightboxPhotos.length === 0) return;
            currentLightboxIndex = index;
            updateLightboxContent();
            document.getElementById('imageLightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('imageLightboxModal').classList.add('hidden');
        }

        function updateLightboxContent() {
            const photo = currentLightboxPhotos[currentLightboxIndex];
            if (!photo) return;

            document.getElementById('lightboxImage').src = photo.url;
            document.getElementById('lightboxCaption').innerText = photo.caption || '';
            document.getElementById('lightboxCounter').innerText = `${currentLightboxIndex + 1} / ${currentLightboxPhotos.length}`;

            const showNav = currentLightboxPhotos.length > 1;
            document.getElementById('lightboxPrevBtn').style.display = showNav ? 'block' : 'none';
            document.getElementById('lightboxNextBtn').style.display = showNav ? 'block' : 'none';
        }

        function prevLightboxImage() {
            currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxPhotos.length) % currentLightboxPhotos.length;
            updateLightboxContent();
        }

        function nextLightboxImage() {
            currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxPhotos.length;
            updateLightboxContent();
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('imageLightboxModal');
            if (modal && !modal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') prevLightboxImage();
                if (e.key === 'ArrowRight') nextLightboxImage();
            }
        });
    </script>
</body>
</html>
