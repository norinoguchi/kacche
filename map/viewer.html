<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Authentic Japan Guide - Japan Maps & Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slateDark: '#0b0f19',
                        slateCard: '#131c2e',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background-color: #131c2e !important; color: #f8fafa !important; border: 1px solid #1e293b; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .leaflet-container { font-family: 'Noto Sans JP', sans-serif; }
        .leaflet-popup-close-button { color: #94a3b8 !important; }
        .leaflet-touch .leaflet-bar, .leaflet-bar { border: none !important; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border-radius: 0.875rem !important; overflow: hidden; background-color: rgba(19, 28, 46, 0.85) !important; backdrop-filter: blur(8px); border: 1px solid rgba(51, 65, 85, 0.8) !important; }
        .leaflet-touch .leaflet-bar a, .leaflet-bar a { background-color: transparent !important; color: #94a3b8 !important; border-bottom: 1px solid rgba(51, 65, 85, 0.6) !important; width: 36px !important; height: 36px !important; display: flex !important; align-items: center !important; justify-content: center !important; transition: all 0.2s ease !important; }
        .leaflet-touch .leaflet-bar a:hover, .leaflet-bar a:hover { background-color: rgba(30, 41, 59, 0.9) !important; color: #ffffff !important; }
        .spot-marker-icon { transition: transform 0.2s ease; cursor: pointer; }
        .spot-marker-icon:hover { transform: scale(1.25); z-index: 1000 !important; }
        .leaflet-tooltip.custom-map-tooltip { background-color: #131c2e !important; color: #f8fafa !important; border: 1px solid #334155 !important; border-radius: 0.75rem !important; padding: 4px 10px !important; font-size: 11px !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        /* 地図タイルをモノトーン・シックに調整 */
        .leaflet-tile-pane {
            filter: grayscale(100%) contrast(120%) brightness(105%);
        }
    </style>
</head>
<body class="bg-slateDark text-slate-100 h-full flex flex-col overflow-hidden">

<!-- Header -->
    <header class="bg-slateCard/80 backdrop-blur-md border-b border-slate-800 px-3 sm:px-6 py-3 flex items-center justify-between gap-3 shrink-0 z-20">
        <div class="flex items-center space-x-2.5 flex-1 min-w-0">
            <a id="btnBackToPortal" href="index.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 p-2 sm:px-3 sm:py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="hidden sm:inline">Portal</span>
            </a>
            <div class="flex-1 min-w-0">
                <h1 class="text-xs sm:text-base font-bold tracking-tight text-white flex items-center gap-2 leading-snug">
                    <span id="txt-app-title" class="break-words">Japan Discovery</span>
                    <span id="txt-badge-title" class="hidden sm:inline-block text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-normal shrink-0">Map</span>
                </h1>
                <p id="txt-subtitle" class="text-[10px] sm:text-xs text-slate-400 hidden sm:block truncate mt-0.5">Loading...</p>
            </div>
        </div>
        <!-- Language Selector (カスタム矢印仕様) -->
        <div class="relative inline-block shrink-0">
            <select id="langSelector" onchange="changeLanguage(this.value)" class="appearance-none bg-slate-900 border border-slate-700 rounded-xl pl-3 pr-8 py-1.5 text-xs text-white focus:outline-none focus:border-slate-500 cursor-pointer shadow-sm">
                <option value="en">🇺🇸 English</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="zh-TW">🇹🇼 繁體中文</option>
                <option value="zh-CN">🇨🇳 简体中文</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="th">🇹🇭 ไทย</option>
                <option value="id">🇮🇩 Bahasa Indonesia</option>
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="es">🇪🇸 Español</option>
            </select>
            <!-- すっきりしたカスタム矢印アイコン -->
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>
        </div>
    </header>
    
    <!-- Toolbar (Nav & Filter) -->
    <div class="bg-slateCard/40 border-b border-slate-800 px-4 sm:px-6 py-2.5 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-2.5 shrink-0 z-10">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 flex-1 min-w-0">
            <!-- View Switcher -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800 shrink-0 justify-between sm:justify-start">
                <button onclick="switchView('list')" id="btn-view-list" class="flex-1 sm:flex-none px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 text-white shadow-md bg-slate-800 border-slate-700">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    <span id="txt-nav-list">リスト</span>
                </button>
                <button onclick="switchView('map')" id="btn-view-map" class="flex-1 sm:flex-none px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-white">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    <span id="txt-nav-map">マップ</span>
                </button>
                <button onclick="switchView('calendar')" id="btn-view-calendar" class="flex-1 sm:flex-none px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-white">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="txt-nav-calendar">カレンダー</span>
                </button>
            </div>
            <!-- Category Filter (Horizontal Scroll) -->
            <div class="relative flex items-center w-full min-w-0 overflow-hidden flex-1">
                <button id="catScrollLeft" onclick="scrollCategories(-120)" class="absolute left-0 z-10 hidden p-1 bg-gradient-to-r from-slateCard to-transparent text-slate-300 h-full flex items-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
                <div id="catFilterScroll" onscroll="checkCatScroll()" class="flex items-center gap-1.5 overflow-x-auto flex-nowrap py-0.5 no-scrollbar w-full scroll-smooth">
                    <!-- JSで動的生成 -->
                </div>
                <button id="catScrollRight" onclick="scrollCategories(120)" class="absolute right-0 z-10 hidden p-1 bg-gradient-to-l from-slateCard to-transparent text-slate-300 h-full flex items-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg></button>
            </div>
        </div>
        <!-- Search Bar -->
        <div id="searchContainer" class="relative w-full md:w-64 hidden">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></span>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="地域名や名称で検索..." class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl pl-9 pr-8 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-slate-600 focus:ring-1 focus:ring-slate-600">
            <button id="searchClearBtn" onclick="clearSearch()" class="absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400 hover:text-white hidden"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
    </div>

    <!-- Category Description Area -->
    <div id="categoryDescArea" class="hidden bg-slate-950/50 border-b border-slate-800 px-5 sm:px-7 py-2.5 shrink-0 z-10">
        <p id="categoryDescText" class="text-xs text-slate-300 leading-relaxed"></p>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden flex">
        <!-- Map View -->
        <div id="view-map" class="absolute inset-0 flex hidden">
            <div id="map" class="w-full h-full z-0"></div>
        </div>

        <!-- List View -->
        <div id="view-list" class="absolute inset-0 bg-slateDark overflow-y-auto p-4 sm:p-6">
            <div class="max-w-6xl mx-auto">
                 <!-- 多言語対応の解説文表示エリア（枠で囲み、下地と文字サイズを調整） -->
                <div id="listDescriptionArea" class="hidden bg-slate-800/90 border border-slate-600/80 rounded-2xl p-4 sm:p-5 mb-5 text-sm sm:text-base text-slate-100 leading-relaxed shadow-lg">
                    <p id="listDescriptionText"></p>
                </div>

                <h2 class="text-base sm:text-lg font-bold text-white mb-4 flex items-center gap-2"><span id="txt-list-title">リスト</span><span class="text-xs font-normal text-slate-400" id="listCount">（0）</span></h2>
                <div id="listContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- JSで動的生成 -->
                </div>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="view-calendar" class="absolute inset-0 bg-slateDark overflow-y-auto p-4 sm:p-6 hidden">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-col sm:flex-row items-center justify-between mb-6 bg-slateCard/60 border border-slate-800 px-4 sm:px-6 py-3 sm:py-4 rounded-2xl shadow-lg gap-3">
                    <div class="flex items-center gap-2">
                        <button onclick="changeCalendarPeriod(-1)" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                        <h2 id="calendarMonthTitle" class="text-base sm:text-lg font-bold text-white font-mono tracking-tight text-center sm:text-left min-w-[140px]">2026年 10月</h2>
                        <button onclick="changeCalendarPeriod(1)" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                    </div>
                    <!-- 月 / 週 切り替えボタン -->
                    <div class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                        <button onclick="setCalendarMode('month')" id="btn-cal-month" class="px-3 py-1 rounded-lg text-xs font-medium transition-all text-white bg-slate-800 shadow-sm">月表示</button>
                        <button onclick="setCalendarMode('week')" id="btn-cal-week" class="px-3 py-1 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white">週表示</button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="bg-slateCard/40 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div id="calendarHeaders" class="grid grid-cols-7 bg-slate-900/90 text-center text-xs font-semibold text-slate-400 py-3 border-b border-slate-800">
                        <!-- 曜日ヘッダーはJSで生成 -->
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 bg-slate-800/20 gap-px">
                        <!-- 日付セルはJSで生成 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col card-transition">
            <div id="modalContent" class="p-5 sm:p-6 overflow-y-auto flex-1 space-y-5">
                <!-- JSで動的生成 -->
            </div>
            <div class="bg-slate-900/60 px-5 sm:px-6 py-3.5 border-t border-slate-800 flex justify-end gap-3 shrink-0">
                <button onclick="closeDetailModal()" id="txt-close" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="fixed inset-0 z-[60] bg-black/95 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <button onclick="closeLightbox()" class="absolute top-4 sm:top-6 right-4 sm:right-6 text-slate-300 hover:text-white z-20 bg-slate-800/50 hover:bg-slate-700/80 p-2 sm:p-2.5 rounded-full backdrop-blur-sm transition-colors">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="relative w-full max-w-5xl h-full max-h-[85vh] flex items-center justify-center p-4">
            <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
                <img id="lightboxImg1" src="" class="absolute max-w-full max-h-full object-contain rounded-xl shadow-2xl transition-opacity duration-700 opacity-100">
                <img id="lightboxImg2" src="" class="absolute max-w-full max-h-full object-contain rounded-xl shadow-2xl transition-opacity duration-700 opacity-0">
            </div>
            <div id="lightboxCaption" class="absolute bottom-8 inset-x-0 text-center text-white text-xs sm:text-sm bg-black/60 py-2 px-4 mx-auto w-max max-w-xl rounded-xl backdrop-blur-md hidden z-10"></div>
            <button onclick="changeLightboxImage(-1)" class="absolute left-2 sm:left-6 text-white bg-slate-800/50 hover:bg-slate-700/80 p-2.5 sm:p-3.5 rounded-full backdrop-blur-sm transition-colors z-20" id="lightboxPrev">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button onclick="changeLightboxImage(1)" class="absolute right-2 sm:right-6 text-white bg-slate-800/50 hover:bg-slate-700/80 p-2.5 sm:p-3.5 rounded-full backdrop-blur-sm transition-colors z-20" id="lightboxNext">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
        <div class="absolute bottom-4 left-0 right-0 text-center text-slate-400 text-xs font-mono tracking-widest z-10" id="lightboxCounter"></div>
    </div>

    <!-- License Popup Modal -->
    <div id="licenseModal" class="fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slateCard border border-slate-700 rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
            <h4 class="text-xs font-bold text-amber-400">写真のライセンス / 出典</h4>
            <p id="licenseModalText" class="text-xs text-slate-200 font-mono break-all leading-relaxed"></p>
            <div class="text-right pt-2">
                <button onclick="closeLicenseModal()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // --- 状態管理 & データ ---
        let uiText = {}, mapConfig = {}, spotData = { spots: [], spotContentI18n: {} };
        let currentMapID = 'matsuri', currentLang = 'ja';
        let currentView = 'list', currentFilter = 'all', searchQuery = '';
        let map, markersLayer, sysConfig = { defaultMap: 'matsuri', maps: [] };

        let currentCalendarDate = new Date(); // 現在のシステム日付
        currentCalendarDate.setDate(1);       // 毎月1日に固定
        let calendarMode = 'month';          // 'month' または 'week'

        // --- 初期化 ---
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const sysRes = await fetch(`config/maps_index.json?v=${Date.now()}`);
                if (sysRes.ok) sysConfig = await sysRes.json();
            } catch (e) { console.warn('maps_index.json読み込み失敗', e); }

            const urlParams = new URLSearchParams(window.location.search);
            currentMapID = urlParams.get('map') || sysConfig.defaultMap || 'matsuri';
            currentLang = urlParams.get('lang') || 'ja';
            document.getElementById('langSelector').value = currentLang;

            initMap();
            await loadAllData();
            applyThemeAndText();
            renderCurrentView();
            window.addEventListener('resize', checkCatScroll);
        });

        async function loadAllData() {
            try {
                const [uiRes, configRes, dataRes] = await Promise.all([
                    fetch(`config/common_ui.json?v=${Date.now()}`),
                    fetch(`config/${currentMapID}_config.json?v=${Date.now()}`),
                    fetch(`data/${currentMapID}_data.json?v=${Date.now()}`)
                ]);
                if (uiRes.ok) uiText = await uiRes.json();
                if (configRes.ok) mapConfig = await configRes.json();
                if (dataRes.ok) spotData = await dataRes.json();
            } catch (e) { console.error('データ読み込み失敗', e); }
        }

        function getLocalizedUI(key) { return ((uiText[currentLang] || uiText['ja'] || {})[key]) || key; }
        function getLocalizedConfig(key) { 
            const configI18n = (mapConfig.i18n && mapConfig.i18n[currentLang]) || (mapConfig.i18n && mapConfig.i18n['ja']) || {};
            return configI18n[key] || '';
        }

        // --- テーマ & テキスト適用 ---
        function applyThemeAndText() {
            const currentMapInfo = sysConfig.maps ? sysConfig.maps.find(m => m.id === currentMapID) : null;
            
            const mapType = currentMapInfo?.mapType || (currentMapInfo?.hasCalendar === false ? 'spot' : 'event');
            const hasCalendar = (mapType === 'event');
            const icon = currentMapInfo ? (currentMapInfo.icon || '📍') : '📍';
            const theme = currentMapInfo?.theme || { btnTheme: 'bg-amber-600', badgeTheme: 'bg-amber-500/10 text-amber-400 border-amber-500/25' };

            mapConfig.mapType = mapType;
            mapConfig.hasCalendar = hasCalendar;
            mapConfig.icon = icon;
            mapConfig.btnTheme = theme.btnTheme;
            mapConfig.badgeTheme = theme.badgeTheme;
            mapConfig.categories = currentMapInfo?.categories || mapConfig.categories || [];

            const calendarBtn = document.getElementById('btn-view-calendar');
            if (calendarBtn) {
                calendarBtn.style.display = hasCalendar ? 'flex' : 'none';
            }            
            if (!hasCalendar && currentView === 'calendar') switchView('map');

            document.getElementById('btnBackToPortal').href = `index.html?lang=${currentLang}`;
            document.getElementById('txt-app-title').innerText = getLocalizedConfig('title') || "Japan Discovery";
            document.getElementById('txt-badge-title').innerText = currentMapID.toUpperCase();

            // サブタイトルや解説文の取得と反映
            const subtitle = getLocalizedConfig('subtitle') || "";
            document.getElementById('txt-subtitle').innerText = subtitle;

            // リスト上部の解説エリアへの反映（設定に listDescription または subtitle を使用する場合）
            const listDescArea = document.getElementById('listDescriptionArea');
            const listDescText = document.getElementById('listDescriptionText');
            const customListDesc = getLocalizedConfig('listDescription') || subtitle;

            if (customListDesc) {
                listDescText.innerText = customListDesc;
                listDescArea.classList.remove('hidden');
            } else {
                listDescArea.classList.add('hidden');
            }

            document.getElementById('txt-subtitle').innerText = getLocalizedConfig('subtitle') || "";
            document.getElementById('txt-list-title').innerText = getLocalizedUI('listTitle') || "Spot List";

            document.getElementById('txt-nav-map').innerText = getLocalizedUI('navMap');
            document.getElementById('txt-nav-list').innerText = getLocalizedUI('navList');
            document.getElementById('txt-nav-calendar').innerText = getLocalizedUI('navCalendar');

            // カレンダー切り替えボタンの多言語化反映
            document.getElementById('btn-cal-month').innerText = getLocalizedUI('Monthly') || "Monthly";
            document.getElementById('btn-cal-week').innerText = getLocalizedUI('Weekly') || "Weekly";

            const scrollContainer = document.getElementById('catFilterScroll');
            if (hasCalendar) {
                scrollContainer.innerHTML = `
                    <button onclick="filterCategory('all')" id="cat-all" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-white shadow-sm whitespace-nowrap shrink-0 ${currentFilter === 'all' ? mapConfig.btnTheme : 'bg-slate-800 text-slate-300'}">${getLocalizedUI('catAll')}</button>
                    <button onclick="filterCategory('spring')" id="cat-spring" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentFilter === 'spring' ? mapConfig.btnTheme + ' text-white' : 'bg-slate-800 text-slate-300'} whitespace-nowrap shrink-0">${getLocalizedUI('catSpring') || '春 (3-5月)'}</button>
                    <button onclick="filterCategory('summer')" id="cat-summer" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentFilter === 'summer' ? mapConfig.btnTheme + ' text-white' : 'bg-slate-800 text-slate-300'} whitespace-nowrap shrink-0">${getLocalizedUI('catSummer') || '夏 (6-8月)'}</button>
                    <button onclick="filterCategory('autumn')" id="cat-autumn" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentFilter === 'autumn' ? mapConfig.btnTheme + ' text-white' : 'bg-slate-800 text-slate-300'} whitespace-nowrap shrink-0">${getLocalizedUI('catAutumn') || '秋 (9-11月)'}</button>
                    <button onclick="filterCategory('winter')" id="cat-winter" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentFilter === 'winter' ? mapConfig.btnTheme + ' text-white' : 'bg-slate-800 text-slate-300'} whitespace-nowrap shrink-0">${getLocalizedUI('catWinter') || '冬 (12-2月)'}</button>
                `;
                document.getElementById('categoryDescArea').classList.add('hidden');
            } else {
                let html = `<button onclick="filterCategory('all')" id="cat-all" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-white shadow-sm whitespace-nowrap shrink-0 ${currentFilter === 'all' ? mapConfig.btnTheme : 'bg-slate-800 text-slate-300'}">すべて</button>`;
                const curConfI18n = (mapConfig.i18n && mapConfig.i18n[currentLang]) || (mapConfig.i18n && mapConfig.i18n['ja']) || {};
                const catsI18n = curConfI18n.categories || [];

                mapConfig.categories.forEach((cat, idx) => {
                    const cIcon = cat.icon || '📍';
                    const cName = catsI18n[idx]?.name || cat.name || '無題';
                    html += `<button onclick="filterCategory('${cat.name}', ${idx})" id="cat-${cat.name}" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentFilter === cat.name ? mapConfig.btnTheme + ' text-white' : 'bg-slate-800 text-slate-300'} whitespace-nowrap shrink-0">${cIcon} ${cName}</button>`;
                });
                scrollContainer.innerHTML = html;
                updateCategoryDescription();
            }

            document.getElementById('searchInput').placeholder = getLocalizedUI('searchPlaceholder');
            document.getElementById('txt-close').innerText = getLocalizedUI('close');

            const wd = getLocalizedUI('weekdays') || ["日", "月", "火", "水", "木", "金", "土"];
            document.getElementById('calendarHeaders').innerHTML = `<div class="text-red-400">${wd[0]}</div><div>${wd[1]}</div><div>${wd[2]}</div><div>${wd[3]}</div><div>${wd[4]}</div><div>${wd[5]}</div><div class="text-blue-400">${wd[6]}</div>`;

            setTimeout(checkCatScroll, 50);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url);
            applyThemeAndText();
            renderCurrentView(true);
        }

        function checkCatScroll() {
            const container = document.getElementById('catFilterScroll');
            if (!container) return;
            document.getElementById('catScrollLeft').classList.toggle('hidden', container.scrollLeft <= 5);
            document.getElementById('catScrollRight').classList.toggle('hidden', (container.scrollWidth - container.clientWidth - container.scrollLeft) <= 5);
        }

        function scrollCategories(offset) { document.getElementById('catFilterScroll')?.scrollBy({ left: offset, behavior: 'smooth' }); }

        function filterCategory(filterKey, catIdx = -1) {
            currentFilter = filterKey;
            const hasCalendar = mapConfig.hasCalendar !== false;
            let keys = ['all'];
            if (hasCalendar) {
                keys.push('spring', 'summer', 'autumn', 'winter');
            } else {
                (mapConfig.categories || []).forEach(c => keys.push(c.name));
            }

            keys.forEach(k => {
                const btn = document.getElementById(`cat-${k}`);
                if (!btn) return;
                if (k === filterKey) {
                    btn.className = `px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-white shadow-sm whitespace-nowrap shrink-0 ${mapConfig.btnTheme || 'bg-amber-600'}`;
                } else {
                    btn.className = "px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap shrink-0";
                }
            });

            if (!hasCalendar) updateCategoryDescription(catIdx);
            renderCurrentView();
        }

        function updateCategoryDescription(catIdx = -1) {
            if (mapConfig.mapType !== 'spot') return;
            const descArea = document.getElementById('categoryDescArea');
            const descText = document.getElementById('categoryDescText');

            if (currentFilter === 'all' || catIdx === -1) {
                descArea.classList.add('hidden'); descText.innerText = ''; return;
            }

            const curConfI18n = (mapConfig.i18n && mapConfig.i18n[currentLang]) || (mapConfig.i18n && mapConfig.i18n['ja']) || {};
            const catsI18n = curConfI18n.categories || [];
            const cat = mapConfig.categories[catIdx];
            const cDesc = catsI18n[catIdx]?.desc || cat.desc || '';

            if (cDesc) {
                descText.innerText = `${cat.icon || '📍'} ${cDesc}`;
                descArea.classList.remove('hidden');
            } else {
                descArea.classList.add('hidden');
            }
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([37.5, 138.0], 6);
            
            const CustomUnifiedControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function(mInst) {
                    const container = L.DomUtil.create('div', 'leaflet-bar');
                    L.DomEvent.disableClickPropagation(container);
                    
                    const fitBtn = L.DomUtil.create('a', '', container);
                    fitBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>`;
                    fitBtn.title = getLocalizedUI('btnFitMap');
                    L.DomEvent.on(fitBtn, 'click', (e) => { L.DomEvent.stop(e); fitMapToFilteredSpots(); });

                    const zIn = L.DomUtil.create('a', '', container);
                    zIn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`;
                    zIn.title = "Zoom In";
                    L.DomEvent.on(zIn, 'click', (e) => { L.DomEvent.stop(e); mInst.zoomIn(); });

                    const zOut = L.DomUtil.create('a', '', container);
                    zOut.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>`;
                    zOut.title = "Zoom Out";
                    L.DomEvent.on(zOut, 'click', (e) => { L.DomEvent.stop(e); mInst.zoomOut(); });

                    return container;
                }
            });
            map.addControl(new CustomUnifiedControl());

            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
            }).addTo(map);
            // L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', {
            //     maxZoom: 18,
            //     attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
            // }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }

        function fitMapToFilteredSpots() {
            if (!map) return;
            const filtered = getFilteredSpots();
            if (filtered.length === 0) { map.setView([37.5, 138.0], 6); return; }
            map.fitBounds(L.latLngBounds(filtered.map(s => [s.lat, s.lng])), { padding: [50, 50], maxZoom: 14 });
        }

        function getSeasonFromDate(dateStr) {
            if (!dateStr) return 'summer';
            const m = parseInt(dateStr.split('-')[1], 10);
            if (m >= 3 && m <= 5) return 'spring';
            if (m >= 6 && m <= 8) return 'summer';
            if (m >= 9 && m <= 11) return 'autumn';
            return 'winter';
        }

        function getLocalizedSpot(spot) {
            const spotI18n = (spotData.spotContentI18n && (spotData.spotContentI18n[spot.id] || spotData.spotContentI18n[String(spot.id)])) || {};
const langData = spotI18n[currentLang] || spotI18n['en'] || spotI18n['ja'] || {};
            const startDate = spot.startDate || '2027-05-01';

            return {
                ...spot,
                season: getSeasonFromDate(startDate),
                startDate: startDate,
                endDate: spot.endDate || startDate,
                title: langData.title || '',
                location: langData.location || '',
                desc: langData.desc || '',
                photos: spot.photos || [],
                links: spot.links || []
            };
        }

        function getFilteredSpots() {
            const hasCalendar = mapConfig.hasCalendar !== false;
            return (spotData.spots || []).map(s => getLocalizedSpot(s)).filter(spot => {
                if (currentFilter === 'all') return true;
                if (hasCalendar) {
                    return spot.season === currentFilter;
                } else {
                    return spot.category === currentFilter;
                }
            });
        }

        function getSpotCategoryDef(catName) {
            if (!catName || mapConfig.mapType !== 'spot') return null;
            const curConfI18n = (mapConfig.i18n && mapConfig.i18n[currentLang]) || (mapConfig.i18n && mapConfig.i18n['en']) || (mapConfig.i18n && mapConfig.i18n['ja']) || {};
            const catsI18n = curConfI18n.categories || [];

            const idx = mapConfig.categories.findIndex(c => c.name === catName);
            if (idx !== -1) {
                const def = mapConfig.categories[idx];
                return {
                    icon: def.icon || '📍',
                    name: catsI18n[idx]?.name || def.name
                };
            }
            return null;
        }

        function renderCurrentView(retainView = false) {
            if (currentView === 'map') updateMapMarkers(retainView);
            if (currentView === 'list') renderListView();
            if (currentView === 'calendar' && mapConfig.hasCalendar !== false) renderCalendarView();
        }

        function updateMapMarkers(retainView = false) {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            const seasonIcons = { 'spring': '🌸', 'summer': '🌿', 'autumn': '🍁', 'winter': '❄️' };

            getFilteredSpots().forEach(spot => {
                let iconHtml = '';
                if (mapConfig.mapType === 'spot') {
                    const catDef = getSpotCategoryDef(spot.category);
                    const cIcon = catDef?.icon || mapConfig.icon || '📍';
                    iconHtml = `<div class="flex items-center justify-center text-2xl spot-marker-icon" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));">${cIcon}</div>`;
                } else {
                    const cIcon = seasonIcons[spot.season] || mapConfig.icon || '📍';
                    iconHtml = `<div class="flex items-center justify-center text-2xl spot-marker-icon" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));">${cIcon}</div>`;
                }

                const marker = L.marker([spot.lat, spot.lng], {
                    icon: L.divIcon({ className: 'custom-div-icon', html: iconHtml, iconSize: [36, 36], iconAnchor: [18, 18] })
                });

                marker.bindTooltip(spot.title, { direction: 'top', offset: [0, -15], className: 'custom-map-tooltip' });
                marker.on('click', () => showDetailModal(spot.id));
                markersLayer.addLayer(marker);
            });

            if (!retainView) {
                fitMapToFilteredSpots();
            }
        }

        function renderListView() {
            const container = document.getElementById('listContainer');
            const filtered = getFilteredSpots().filter(spot => !searchQuery || (spot.title || '').toLowerCase().includes(searchQuery) || (spot.location || '').toLowerCase().includes(searchQuery));
            document.getElementById('listCount').innerText = `（${filtered.length}）`;
            if (filtered.length === 0) { container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">${getLocalizedUI('noResult')}</div>`; return; }

            const hasCalendar = mapConfig.hasCalendar !== false;
            container.innerHTML = filtered.map(spot => {
                const thumb = spot.photos?.[0]?.url;
                const dateStr = spot.startDate === spot.endDate ? spot.startDate : `${spot.startDate} 〜 ${spot.endDate}`;
                
                let catBadgeHtml = '';
                if (mapConfig.mapType === 'spot') {
                    const catDef = getSpotCategoryDef(spot.category);
                    const cIcon = catDef?.icon || '📍';
                    const cName = catDef?.name || spot.category;
                    catBadgeHtml = `${cIcon} ${cName}`;
                } else {
                    // シーズンに応じた正しいアイコンを表示するよう修正
                    const seasonIcons = { 'spring': '🌸', 'summer': '🌿', 'autumn': '🍁', 'winter': '❄️' };
                    const cIcon = seasonIcons[spot.season] || mapConfig.icon || '📍';
                    catBadgeHtml = `${cIcon} ${spot.season.toUpperCase()}`;
                }
            return `         
                    <div onclick="showDetailModal(${spot.id})" class="bg-slateCard/70 border border-slate-800/80 hover:border-slate-700 rounded-2xl p-4 sm:p-5 cursor-pointer transition-all hover:shadow-xl flex flex-col justify-between">
                        <div>
                            ${thumb ? `<div class="w-full h-36 rounded-xl mb-3 overflow-hidden bg-slate-900"><img src="${thumb}" class="w-full h-full object-cover"></div>` : ''}
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs px-2.5 py-1 rounded-lg font-medium border ${mapConfig.badgeTheme || ''}">
                                    ${catBadgeHtml}
                                </span>
                                ${hasCalendar ? `<span class="text-xs font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">${dateStr}</span>` : ''}
                            </div>
                            <h3 class="text-sm font-bold text-white mb-1.5">${spot.title || ''}</h3>
                            <p class="text-xs text-slate-400 flex items-center gap-1.5 mb-3">${spot.location || ''}</p>
                            <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${spot.desc || ''}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs font-medium">
                            <span class="${mapConfig.btnTheme.replace('bg-','text-')} group-hover:underline">${getLocalizedUI('detailLink')}</span>
                            <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 詳細モーダル表示 ---
        function showDetailModal(id) {
            const rawSpot = (spotData.spots || []).find(s => Number(s.id) === Number(id));
            if (!rawSpot) return;
            const spot = getLocalizedSpot(rawSpot);
            
            const hasCalendar = mapConfig.hasCalendar !== false;
            const dateStr = spot.startDate === spot.endDate ? spot.startDate : `${spot.startDate} 〜 ${spot.endDate}`;
            
            let catBadgeHtml = '';
            if (mapConfig.mapType === 'spot') {
                const catDef = getSpotCategoryDef(spot.category);
                const cIcon = catDef?.icon || '📍';
                const cName = catDef?.name || spot.category;
                catBadgeHtml = `${cIcon} ${cName}`;
            } else {
                // シーズンに応じた正しい絵文字アイコンを表示
                const seasonIcons = { 'spring': '🌸', 'summer': '🌿', 'autumn': '🍁', 'winter': '❄️' };
                const cIcon = seasonIcons[spot.season] || mapConfig.icon || '📍';
                catBadgeHtml = `${cIcon} ${spot.season.toUpperCase()}`;
            }


            let photosHtml = '';
            if (spot.photos && spot.photos.length > 0) {
                photosHtml = `
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 mb-2">${getLocalizedUI('photosTitle')}</h4>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            ${spot.photos.map((p, idx) => `
                                <div class="space-y-1">
                                    <div onclick="openLightbox(${spot.id},${idx})" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 h-28 relative group cursor-pointer hover:border-slate-500 transition-colors">
                                        <img src="${p.url}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">
                                        ${p.caption ? `<div class="absolute inset-x-0 bottom-0 bg-black/70 p-1 text-[9px] text-white truncate">${p.caption}</div>` : ''}
                                    </div>
                                    <div class="flex items-center justify-between px-1">
                                        <span class="text-[9px] text-slate-500">Photo #${idx + 1}</span>${p.license ? `<button onclick="showLicensePopup('${encodeURIComponent(p.license)}')" class="text-[10px] text-slate-400 hover:text-amber-400 underline cursor-pointer transition-colors">© Copy Right</button>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
         
            let linksHtml = '';
            if (spot.links && spot.links.length > 0) {
                linksHtml = `
                    <div class="space-y-2">
                        <h4 class="text-xs font-bold text-amber-400">${getLocalizedUI('linksTitle')}</h4>
                        <div class="flex flex-wrap gap-2">
                            ${spot.links.map(l => `<a href="${l.url}" target="_blank" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 transition-colors">${l.text || l.label} ↗</a>`).join('')}
                        </div>
                    </div>
                `;
            }

            let consultBtnHtml = `<button class="${mapConfig.btnTheme} text-white px-5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-md transition-transform hover:scale-105">Go！</button>`;
            if (spot.consultUrl) {
                consultBtnHtml = `<a href="${spot.consultUrl}" target="_blank" class="${mapConfig.btnTheme} text-white px-5 py-2.5 rounded-xl text-xs font-bold inline-block text-center whitespace-nowrap shadow-md transition-transform hover:scale-105">Go！</a>`;
            }

            document.getElementById('modalContent').innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs px-2.5 py-1 rounded-lg font-medium border ${mapConfig.badgeTheme}">${catBadgeHtml}</span>
                    ${hasCalendar ? `<span class="text-xs font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">${dateStr}</span>` : ''}
                </div>
                <h3 class="text-base font-bold text-white mb-2">${spot.title}</h3>
                <p class="text-xs text-slate-400 mb-4">${spot.location}</p>
                <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800"><p class="text-xs text-slate-300 leading-relaxed">${spot.desc}</p></div>
                ${photosHtml}
                ${linksHtml}
                 <div class="bg-amber-600/10 border border-amber-500/30 rounded-xl p-4 flex justify-between items-center gap-3">
                    <div>
                        <h4 class="text-sm font-bold text-amber-400">${getLocalizedUI('actionTitle')}</h4>
                        <p class="text-[11px] text-slate-400 mt-1">${getLocalizedUI('actionDesc')}</p>
                    </div>
                    ${consultBtnHtml}
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        // --- ビュー切り替え & 検索 ---
        function switchView(viewName) {
            currentView = viewName;
            
            const views = ['map', 'list', 'calendar'];
            views.forEach(v => {
                const btn = document.getElementById(`btn-view-${v}`);
                if (!btn) return;
                if (v === viewName) {
                    btn.className = "flex-1 sm:flex-none px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 text-white shadow-md bg-slate-800 border-slate-700";
                } else {
                    btn.className = "flex-1 sm:flex-none px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-white";
                }
                
                const panel = document.getElementById(`view-${v}`);
                if (panel) {
                    if (v === viewName) {
                        panel.classList.remove('hidden');
                    } else {
                        panel.classList.add('hidden');
                    }
                }
            });

            const searchContainer = document.getElementById('searchContainer');
            if (searchContainer) {
                if (viewName === 'calendar') {
                    searchContainer.classList.add('hidden');
                } else {
                    searchContainer.classList.remove('hidden');
                }
            }
            
            if (viewName === 'map' && map) {
                setTimeout(() => {
                    map.invalidateSize();
                    fitMapToFilteredSpots();
                }, 10);
            }

            renderCurrentView();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) {
                clearBtn.classList.toggle('hidden', searchQuery.length === 0);
            }
            renderCurrentView();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('searchClearBtn')?.classList.add('hidden');
            renderCurrentView();
        }

        // --- 写真スライドショー ---
        let lightboxPhotos = [];
        let currentLightboxIndex = 0;
        let activeImgLayer = 1;
        let slideshowTimer = null;

        function openLightbox(spotId, index) {
            const rawSpot = (spotData.spots || []).find(s => Number(s.id) === Number(spotId));
            if (!rawSpot || !rawSpot.photos || rawSpot.photos.length === 0) return;
            
            const spot = getLocalizedSpot(rawSpot);
            lightboxPhotos = spot.photos;
            currentLightboxIndex = index;
            
            activeImgLayer = 1;
            const img1 = document.getElementById('lightboxImg1');
            const img2 = document.getElementById('lightboxImg2');
            
            img1.src = lightboxPhotos[currentLightboxIndex].url;
            img1.classList.remove('opacity-0');
            img1.classList.add('opacity-100');
            
            img2.src = '';
            img2.classList.remove('opacity-100');
            img2.classList.add('opacity-0');

            updateLightboxText();
            
            const modal = document.getElementById('lightboxModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);

            startSlideshow();
        }

        function closeLightbox() {
            stopSlideshow();
            const modal = document.getElementById('lightboxModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                lightboxPhotos = [];
            }, 300);
        }

        function changeLightboxImage(dir, isManual = true) {
            if (isManual) stopSlideshow(); 
            
            currentLightboxIndex += dir;
            if (currentLightboxIndex < 0) currentLightboxIndex = lightboxPhotos.length - 1;
            if (currentLightboxIndex >= lightboxPhotos.length) currentLightboxIndex = 0;
            
            updateLightboxUI();

            if (isManual) startSlideshow();
        }

        function updateLightboxUI() {
            if (!lightboxPhotos || lightboxPhotos.length === 0) return;
            const photo = lightboxPhotos[currentLightboxIndex];
            
            const img1 = document.getElementById('lightboxImg1');
            const img2 = document.getElementById('lightboxImg2');

            if (activeImgLayer === 1) {
                img2.src = photo.url;
                img2.onload = () => {
                    img2.classList.remove('opacity-0');
                    img2.classList.add('opacity-100');
                    img1.classList.remove('opacity-100');
                    img1.classList.add('opacity-0');
                };
                activeImgLayer = 2;
            } else {
                img1.src = photo.url;
                img1.onload = () => {
                    img1.classList.remove('opacity-0');
                    img1.classList.add('opacity-100');
                    img2.classList.remove('opacity-100');
                    img2.classList.add('opacity-0');
                };
                activeImgLayer = 1;
            }

            updateLightboxText();
        }

        function updateLightboxText() {
            if (!lightboxPhotos || lightboxPhotos.length === 0) return;
            const photo = lightboxPhotos[currentLightboxIndex];
            
            const captionEl = document.getElementById('lightboxCaption');
            if (photo.caption) {
                captionEl.innerText = photo.caption;
                captionEl.classList.remove('hidden');
            } else {
                captionEl.classList.add('hidden');
            }
            
            document.getElementById('lightboxCounter').innerText = `${currentLightboxIndex + 1} / ${lightboxPhotos.length}`;
            
            const showArrows = lightboxPhotos.length > 1;
            document.getElementById('lightboxPrev').style.display = showArrows ? 'block' : 'none';
            document.getElementById('lightboxNext').style.display = showArrows ? 'block' : 'none';
        }

        function startSlideshow() {
            stopSlideshow();
            if (lightboxPhotos.length > 1) {
                slideshowTimer = setInterval(() => {
                    changeLightboxImage(1, false);
                }, 2000);
            }
        }

        function stopSlideshow() {
            if (slideshowTimer) clearInterval(slideshowTimer);
        }

        function showLicensePopup(encodedLicense) {
            const licenseText = decodeURIComponent(encodedLicense);
            document.getElementById('licenseModalText').innerText = licenseText;
            document.getElementById('licenseModal').classList.remove('hidden');
        }

        function closeLicenseModal() {
            document.getElementById('licenseModal').classList.add('hidden');
        }

        // モード変更関数
        function setCalendarMode(mode) {
            calendarMode = mode;
            const btnMonth = document.getElementById('btn-cal-month');
            const btnWeek = document.getElementById('btn-cal-week');
            if (mode === 'month') {
                btnMonth.className = "px-3 py-1 rounded-lg text-xs font-medium transition-all text-white bg-slate-800 shadow-sm";
                btnWeek.className = "px-3 py-1 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white";
            } else {
                btnWeek.className = "px-3 py-1 rounded-lg text-xs font-medium transition-all text-white bg-slate-800 shadow-sm";
                btnMonth.className = "px-3 py-1 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white";
            }
            renderCalendarView();
        }

        function changeCalendarPeriod(dir) {
            if (calendarMode === 'month') {
                currentCalendarDate.setMonth(currentCalendarDate.getMonth() + dir);
            } else {
                currentCalendarDate.setDate(currentCalendarDate.getDate() + (dir * 7));
            }
            renderCalendarView();
        }

        // 3. カレンダービュー描画（月・週対応 & 週表示縦長・詳細化）
        function renderCalendarView() {
            if (mapConfig.hasCalendar === false) return;
            
            const monthNames = {
                'ja': ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                'en': ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
                'zh-TW': ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                'zh-CN': ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                'ko': ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                'th': ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'],
                'id': ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'],
                'vi': ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'],
                'es': ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre']
            };
            const mNames = monthNames[currentLang] || monthNames['en'];
            const filtered = getFilteredSpots();
            const grid = document.getElementById('calendarGrid');
            const wd = getLocalizedUI('weekdays') || ["日", "月", "火", "水", "木", "金", "土"];
            let html = '';

            if (calendarMode === 'month') {
                // 【月表示】 7列グリッド＆曜日ヘッダーを表示に戻す
                grid.className = "grid grid-cols-7 bg-slate-800/20 gap-px";
                document.getElementById('calendarHeaders').style.display = 'grid';

                const y = currentCalendarDate.getFullYear(), m = currentCalendarDate.getMonth();
                if (['en', 'es', 'id'].includes(currentLang)) {
                    document.getElementById('calendarMonthTitle').innerText = `${mNames[m]} ${y}`;
                } else if (currentLang === 'vi') {
                    document.getElementById('calendarMonthTitle').innerText = `${mNames[m]}, ${y}`;
                } else {
                    document.getElementById('calendarMonthTitle').innerText = `${y}年 ${mNames[m]}`;
                }

                const firstDay = new Date(y, m, 1).getDay(), totalDays = new Date(y, m + 1, 0).getDate();
                
                for (let i = 0; i < firstDay; i++) html += `<div class="bg-slate-900/30 min-h-[90px] p-1.5 opacity-30"></div>`;
                
                for (let day = 1; day <= totalDays; day++) {
                    const dateKey = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const daySpots = filtered.filter(s => dateKey >= s.startDate && dateKey <= (s.endDate || s.startDate));
                    
                    html += `
                        <div class="min-h-[100px] p-1.5 sm:p-2 flex flex-col border bg-slateCard/60 border-slate-800/40">
                            <div class="flex items-center justify-between mb-1"><span class="text-[11px] font-bold text-slate-300">${day}</span>${daySpots.length ? `<span class="text-[9px] bg-amber-500/20 text-amber-400 px-1 py-0.5 rounded-full font-mono">${daySpots.length}</span>` : ''}</div>
                            <div class="flex-1 space-y-1 overflow-y-auto max-h-[70px]">
                                ${daySpots.map(s => `<div onclick="showDetailModal(${s.id})" class="text-[10px] px-1.5 py-0.5 rounded-md truncate cursor-pointer bg-amber-500/15 text-amber-300 border border-amber-500/20">${s.title}</div>`).join('')}
                            </div>
                        </div>
                    `;
                }
            } else {
                // 【週表示】 縦並び1列＆曜日ヘッダーを非表示
                grid.className = "grid grid-cols-1 bg-slate-800/20 gap-2 p-2";
                document.getElementById('calendarHeaders').style.display = 'none';

                const startOfWeek = new Date(currentCalendarDate);
                const dayOfWeek = startOfWeek.getDay();
                startOfWeek.setDate(startOfWeek.getDate() - dayOfWeek);
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(endOfWeek.getDate() + 6);

                const startYear = startOfWeek.getFullYear();
                const endYear = endOfWeek.getFullYear();
                const startMonthName = mNames[startOfWeek.getMonth()];
                const endMonthName = mNames[endOfWeek.getMonth()];
                const startDateNum = startOfWeek.getDate();
                const endDateNum = endOfWeek.getDate();

                let titleStr = '';
                if (['en', 'es', 'id'].includes(currentLang)) {
                    if (startYear !== endYear) {
                        titleStr = `${startMonthName} ${startDateNum}, ${startYear} - ${endMonthName} ${endDateNum}, ${endYear}`;
                    } else {
                        titleStr = `${startMonthName} ${startDateNum} - ${endMonthName} ${endDateNum}, ${startYear}`;
                    }
                } else if (currentLang === 'vi') {
                    if (startYear !== endYear) {
                        titleStr = `${startDateNum} ${startMonthName}, ${startYear} - ${endDateNum} ${endMonthName}, ${endYear}`;
                    } else {
                        titleStr = `${startDateNum} - ${endDateNum} ${startMonthName}, ${startYear}`;
                    }
                } else {
                    if (startYear !== endYear) {
                        titleStr = `${startYear}年 ${startMonthName}${startDateNum}日 - ${endYear}年 ${endMonthName}${endDateNum}日`;
                    } else {
                        titleStr = `${startYear}年 ${startMonthName}${startDateNum}日 - ${endMonthName}${endDateNum}日`;
                    }
                }
                document.getElementById('calendarMonthTitle').innerText = titleStr;

                for (let i = 0; i < 7; i++) {
                    const targetDate = new Date(startOfWeek);
                    targetDate.setDate(targetDate.getDate() + i);
                    const y = targetDate.getFullYear();
                    const m = targetDate.getMonth() + 1;
                    const d = targetDate.getDate();
                    const dayName = wd[i];
                    const dateKey = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const daySpots = filtered.filter(s => dateKey >= s.startDate && dateKey <= (s.endDate || s.startDate));

                    const dayColorClass = i === 0 ? 'text-red-400' : (i === 6 ? 'text-blue-400' : 'text-amber-400');

                    html += `
                        <div class="p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slateCard/80 border border-slate-800 rounded-xl shadow-md">
                            <div class="flex items-center gap-2.5 shrink-0 min-w-[120px]">
                                <span class="text-xs font-bold font-mono ${dayColorClass}">${y}/${m}/${d} (${dayName})</span>
                                ${daySpots.length ? `<span class="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-mono">${daySpots.length}</span>` : '<span class="text-[10px] text-slate-500 font-mono">0</span>'}
                            </div>
                            <div class="flex-1 flex flex-wrap gap-2">
                                ${daySpots.length > 0 ? daySpots.map(s => `
                                    <div onclick="showDetailModal(${s.id})" class="px-2.5 py-1.5 rounded-lg cursor-pointer bg-amber-500/10 hover:bg-amber-500/20 text-amber-200 border border-amber-500/25 transition-colors flex items-center gap-2">
                                        <span class="text-xs font-bold">${s.title}</span>
                                        <span class="text-[9px] text-amber-400/80 font-mono">📍 ${s.location || ''}</span>
                                    </div>
                                `).join('') : '<span class="text-xs text-slate-500 italic">N/A</span>'}
                            </div>
                        </div>
                    `;
                }
            }                       
            grid.innerHTML = html;
        }
    </script>
</body>
</html>
