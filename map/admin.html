<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Discovery - Unified Admin CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { slateDark: '#0b0f19', slateCard: '#131c2e' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="bg-slateDark text-slate-100 h-full flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slateCard/80 backdrop-blur-md border-b border-slate-800 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    Japan Discovery Hub 
                    <span class="hidden sm:inline-block text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-normal">Unified Admin CMS</span>
                </h1>
                <p class="text-[11px] sm:text-xs text-slate-400">データ駆動型マップ統合管理コンソール</p>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <select id="mapSelector" onchange="switchTargetMap(this.value)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-bold focus:outline-none cursor-pointer">
                <option value="">読込中...</option>
            </select>

            <button onclick="openEditMapModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1 border border-slate-700">
                <span>⚙️ マップ設定編集</span>
            </button>

            <button onclick="exportDataFile()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1 border border-slate-700">
                <span class="hidden md:inline">JSON書出</span>
            </button>
            <a id="publicSiteLink" href="viewer.html?map=matsuri" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5 border border-slate-700">
                <span>公開マップ</span>
            </a>
            
            <button onclick="openSpotModalForNew()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-medium shadow-lg flex items-center gap-1">
                <span>＋ スポット追加</span>
            </button>

            <button onclick="openNewMapModal()" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1 border border-emerald-500/30">
                <span>＋ マップ新規</span>
            </button>
        </div>
    </header>

    <!-- Main Table -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-7xl mx-auto w-full">
        <div class="bg-slateCard/60 border border-slate-800 rounded-2xl overflow-x-auto shadow-xl">
            <table class="w-full text-left border-collapse min-w-[750px]">
                <thead>
                    <tr class="bg-slate-900/90 text-xs text-slate-400 border-b border-slate-800 font-semibold select-none">
                        <th class="p-3 sm:p-4">通し番号</th>
                        <th class="p-3 sm:p-4">カテゴリー</th>
                        <th class="p-3 sm:p-4">タイトル (日本語)</th>
                        <th class="p-3 sm:p-4">エリア・開催期間</th>
                        <th class="p-3 sm:p-4">緯度 / 経度</th>
                        <th class="p-3 sm:p-4">最終更新日</th>
                        <th class="p-3 sm:p-4 text-right">アクション</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-slate-800/60 text-xs"></tbody>
            </table>
        </div>
    </main>

    <!-- Map Setting Edit Modal -->
    <div id="editMapModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">⚙️ マップ設定の編集 (<span id="editTargetMapId"></span>)</h3>
                <button onclick="closeEditMapModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="p-5 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">マップID</label>
                        <input type="text" id="editMapIdInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-400 font-mono" disabled>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">絵文字アイコン*</label>
                        <input type="text" id="editMapIconInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-slate-300">マップ名 (日本語)*</label>
                        <button type="button" onclick="autoTranslateEditMap()" id="translateEditMapBtn" class="bg-indigo-600/30 hover:bg-indigo-600 text-indigo-200 px-3 py-1.5 rounded-xl text-xs font-medium transition-all border border-indigo-500/40 flex items-center gap-1.5">
                            🌐 全言語へ自動翻訳
                        </button>
                    </div>
                    <input type="text" id="editMapNameInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-2">

                    <label class="block text-xs font-medium text-slate-300 mb-1">サブタイトル・説明 (日本語)</label>
                    <input type="text" id="editMapSubInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-2">

                    <label class="block text-xs font-medium text-slate-300 mb-1">カラーテーマ*</label>
                    <select id="editMapThemeSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-3">
                        <option value="amber">🔴 アンバー / レッド (祭り系)</option>
                        <option value="purple">🟣 パープル / インディゴ (花火系)</option>
                        <option value="emerald">🟢 エメラルド / ティール (お城・常設系)</option>
                    </select>

                    <div class="flex items-center gap-2.5 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        <input type="checkbox" id="editMapHasCalendar" class="w-4 h-4 bg-slate-950 border border-slate-700 rounded text-emerald-600 cursor-pointer">
                        <label for="editMapHasCalendar" class="text-xs font-medium text-slate-200 cursor-pointer">📅 カレンダー機能を持たせる</label>
                    </div>
                </div>
                <div id="editMapTranslationStatus" class="hidden text-xs text-emerald-400 bg-emerald-900/20 p-3 rounded-xl border border-emerald-500/30 text-center font-bold">
                    ✨ 多言語への自動翻訳が完了しました！
                </div>
            </div>
            <div class="bg-slate-900/80 px-5 py-3.5 border-t border-slate-800 flex justify-end gap-3">
                <button onclick="closeEditMapModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">キャンセル</button>
                <button onclick="saveEditedMapSettings()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-medium">変更ファイルを生成</button>
            </div>
        </div>
    </div>

    <!-- Spot Edit / Add Modal -->
    <div id="spotModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl max-h-[92vh] flex flex-col">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50 shrink-0">
                <h3 id="spotModalTitle" class="text-sm font-bold text-white">スポットの編集</h3>
                <button onclick="closeSpotModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div class="p-5 space-y-5 overflow-y-auto flex-1">
                <input type="hidden" id="spotEditId">
                
                <!-- 基本情報 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">カテゴリー*</label>
                        <input type="text" id="spotCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">エリア / 場所 (日本語)* ※住所取得用</label>
                        <input type="text" id="spotLocationJa" placeholder="例: 静岡県浜松市" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                </div>

                <!-- 緯度経度 ＆ 住所から取得ボタン -->
                <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-bold text-slate-200">📍 位置情報 (緯度・経度)</label>
                        <button type="button" onclick="fetchCoordinatesFromAddress()" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium transition-all border border-emerald-500/40 flex items-center gap-1.5 shadow-sm">
                            <span>📍 住所から緯度経度を取得</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">緯度 (lat)*</label>
                            <input type="number" step="any" id="spotLat" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">経度 (lng)*</label>
                            <input type="number" step="any" id="spotLng" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono">
                        </div>
                    </div>
                </div>

                <!-- 日付 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">開始日 (YYYY-MM-DD)</label>
                        <input type="date" id="spotStartDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">終了日 (YYYY-MM-DD)</label>
                        <input type="date" id="spotEndDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                </div>

                <!-- 写真・フォルダパス・ライセンス管理セクション -->
                <div class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-bold text-slate-200">🖼️ 写真画像・パス・ライセンス管理</label>
                        <button type="button" onclick="addPhotoField()" class="bg-slate-800 hover:bg-slate-750 text-slate-200 px-2.5 py-1 rounded-lg text-xs border border-slate-700">＋ 写真を追加</button>
                    </div>
                    
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">写真格納フォルダプレフィックス (例: picture/matsuri/hamamatsu/)</label>
                        <input type="text" id="spotPhotoBaseDir" placeholder="picture/matsuri/hamamatsu/" oninput="updateAllPhotoUrls()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono">
                    </div>

                    <div id="photosContainer" class="space-y-3">
                        <!-- 動的に写真入力欄が追加されます -->
                    </div>
                </div>

                <!-- 多言語データ自動翻訳 ＆ 手動修正タブ -->
                <div class="border border-slate-700/80 rounded-2xl bg-slate-900/80 overflow-hidden">
                    <div class="bg-slate-950 px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                        <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">🌐 多言語コンテンツ管理 & 手動修正</span>
                        <button type="button" onclick="runAutoTranslate()" id="translateSpotBtn" class="bg-indigo-600/30 hover:bg-indigo-600 text-indigo-200 px-3 py-1.5 rounded-xl text-xs font-medium transition-all border border-indigo-500/40 flex items-center gap-1.5">
                            ✨ 日本語から全言語へ自動翻訳を実行
                        </button>
                    </div>

                    <!-- 言語切り替えタブ -->
                    <div class="flex bg-slate-950/60 border-b border-slate-800 overflow-x-auto px-2 pt-2 gap-1" id="langTabsContainer">
                        <button type="button" onclick="switchLangTab('ja')" id="tab-btn-ja" class="px-3 py-1.5 text-xs font-bold rounded-t-xl bg-slate-900 text-white border-t border-x border-slate-700">🇯🇵 日本語</button>
                        <button type="button" onclick="switchLangTab('en')" id="tab-btn-en" class="px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white">🇺🇸 English</button>
                        <button type="button" onclick="switchLangTab('zh-TW')" id="tab-btn-zh-TW" class="px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white">🇹🇼 繁體中文</button>
                        <button type="button" onclick="switchLangTab('zh-CN')" id="tab-btn-zh-CN" class="px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white">🇨🇳 简体中文</button>
                        <button type="button" onclick="switchLangTab('ko')" id="tab-btn-ko" class="px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white">🇰🇷 한국어</button>
                        <button type="button" onclick="switchLangTab('th')" id="tab-btn-th" class="px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white">🇹🇭 ไทย</button>
                        <button type="button" onclick="switchLangTab('id')" id="tab-btn-id" class="px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white">🇮🇩 Indonesia</button>
                    </div>

                    <div class="p-4 space-y-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-300 mb-1"><span id="currentLangLabel">🇯🇵 日本語</span> - タイトル</label>
                            <input type="text" id="activeLangTitle" oninput="saveCurrentLangInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-300 mb-1">エリア / 場所</label>
                            <input type="text" id="activeLangLocation" oninput="saveCurrentLangInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-300 mb-1">詳細説明</label>
                            <textarea id="activeLangDesc" rows="3" oninput="saveCurrentLangInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"></textarea>
                        </div>
                    </div>
                </div>

            </div>

            <div class="bg-slate-900/80 px-5 py-3.5 border-t border-slate-800 flex justify-end gap-3 shrink-0">
                <button onclick="closeSpotModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">キャンセル</button>
                <button onclick="saveSpotData()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium">保存する</button>
            </div>
        </div>
    </div>

    <!-- New Map Creation Modal -->
    <div id="newMapModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div id="newMapFormArea">
                <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                    <h3 class="text-sm font-bold text-white">新しいマップの作成</h3>
                    <button onclick="closeNewMapModal()" class="text-slate-400 hover:text-white">✕</button>
                </div>
                <div class="p-5 space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">マップID (半角)*</label>
                            <input type="text" id="newMapId" placeholder="例: castle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">絵文字アイコン*</label>
                            <input type="text" id="newMapIcon" placeholder="例: 🏯" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-medium text-slate-300">マップ名 (日本語)*</label>
                            <button type="button" onclick="autoTranslateNewMap()" id="translateNewMapBtn" class="bg-indigo-600/30 hover:bg-indigo-600 text-indigo-200 px-3 py-1.5 rounded-xl text-xs font-medium transition-all border border-indigo-500/40 flex items-center gap-1.5">
                                🌐 全言語へ自動翻訳
                            </button>
                        </div>
                        <input type="text" id="newMapTitleJa" placeholder="例: お城マップ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-2">
                        
                        <label class="block text-xs font-medium text-slate-300 mb-1">サブタイトル・説明 (日本語)</label>
                        <input type="text" id="newMapSubJa" placeholder="例: 全国の名城を探索" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-2">

                        <label class="block text-xs font-medium text-slate-300 mb-1">カラーテーマ</label>
                        <select id="newMapThemeSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-3">
                            <option value="emerald">🟢 エメラルド (常設系)</option>
                            <option value="amber">🔴 アンバー (祭り系)</option>
                            <option value="purple">🟣 パープル (花火系)</option>
                        </select>

                        <div class="flex items-center gap-2.5 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <input type="checkbox" id="newMapHasCalendar" checked class="w-4 h-4 bg-slate-950 border border-slate-700 rounded text-emerald-600 cursor-pointer">
                            <label for="newMapHasCalendar" class="text-xs font-medium text-slate-200 cursor-pointer">📅 カレンダー機能を持たせる</label>
                        </div>
                    </div>
                    <div id="newMapTranslationStatus" class="hidden text-xs text-emerald-400 bg-emerald-900/20 p-3 rounded-xl border border-emerald-500/30 text-center font-bold">
                        ✨ 多言語への自動翻訳が完了しました！
                    </div>
                </div>
                <div class="bg-slate-900/80 px-5 py-3.5 border-t border-slate-800 flex justify-end gap-3">
                    <button onclick="closeNewMapModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">キャンセル</button>
                    <button onclick="prepareNewMapFiles()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-medium">ファイル生成を準備</button>
                </div>
            </div>
            <!-- Download Step -->
            <div id="newMapDownloadArea" class="hidden p-5 space-y-4">
                <div class="bg-amber-900/20 border border-amber-500/30 rounded-xl p-3 text-xs text-amber-300 font-bold text-center">以下のボタンを上から順に保存してください</div>
                <div class="flex flex-col gap-2.5">
                    <button onclick="downloadMapFile(1)" class="w-full px-4 py-3 bg-slate-800 hover:bg-emerald-900 border border-slate-600 text-slate-200 rounded-xl text-xs font-bold flex justify-between"><span>1. maps_index.json</span></button>
                    <button onclick="downloadMapFile(2)" class="w-full px-4 py-3 bg-slate-800 hover:bg-blue-900 border border-slate-600 text-slate-200 rounded-xl text-xs font-bold flex justify-between"><span>2. <span id="dl-btn-2">config.json</span></span></button>
                    <button onclick="downloadMapFile(3)" class="w-full px-4 py-3 bg-slate-800 hover:bg-indigo-900 border border-slate-600 text-slate-200 rounded-xl text-xs font-bold flex justify-between"><span>3. <span id="dl-btn-3">data.json</span></span></button>
                </div>
                <div class="flex justify-end pt-3"><button onclick="location.reload()" class="px-5 py-2 bg-slate-700 text-white rounded-xl text-xs">すべて保存してリロード</button></div>
            </div>
        </div>
    </div>

    <!-- 複数ファイルダウンロード用汎用モーダル -->
    <div id="editMapDownloadModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl p-5 space-y-4">
            <div class="text-xs font-bold text-amber-300 bg-amber-900/20 border border-amber-500/30 p-3 rounded-xl text-center">
                マップ設定と多言語テキストの更新ファイルを保存します。<br>以下の2つのボタンを押してください。
            </div>
            <div class="flex flex-col gap-2.5">
                <button onclick="triggerDownload('maps_index.json', pendingEditFiles.sysConfigStr)" class="w-full px-4 py-3 bg-slate-800 hover:bg-emerald-900 border border-slate-600 text-slate-200 rounded-xl text-xs font-bold flex justify-between">
                    <span>1. maps_index.json <span class="text-[10px] text-slate-400 font-normal">(config/フォルダ用)</span></span>
                </button>
                <button onclick="triggerDownload(pendingEditFiles.configFilename, pendingEditFiles.configStr)" class="w-full px-4 py-3 bg-slate-800 hover:bg-blue-900 border border-slate-600 text-slate-200 rounded-xl text-xs font-bold flex justify-between">
                    <span>2. <span id="edit-dl-btn-2">config.json</span> <span class="text-[10px] text-slate-400 font-normal">(config/フォルダ用)</span></span>
                </button>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="location.reload()" class="px-5 py-2 bg-slate-700 text-white rounded-xl text-xs font-medium">保存完了してリロード</button>
            </div>
        </div>
    </div>

    <script>
        let sysConfig = { defaultMap: 'matsuri', maps: [] };
        let currentMapID = null;
        let rawData = { spots: [], spotContentI18n: {} };
        let pendingMapFiles = {};
        let pendingEditFiles = {};
        let newMapTranslations = {};
        let editMapTranslations = {};

        let currentSpotTranslations = {};
        let currentActiveLang = 'ja';
        let currentSpotPhotos = [];

        const langNames = {
            'ja': '🇯🇵 日本語', 'en': '🇺🇸 English', 'zh-TW': '🇹🇼 繁體中文',
            'zh-CN': '🇨🇳 简体中文', 'ko': '🇰🇷 한국어', 'th': '🇹🇭 ไทย', 'id': '🇮🇩 Indonesia'
        };

        const themePresets = {
            amber: { iconGradient: "from-amber-600 to-red-600", btnTheme: "bg-amber-600 hover:bg-amber-500", badgeTheme: "bg-amber-500/10 text-amber-400 border-amber-500/25" },
            purple: { iconGradient: "from-purple-600 to-indigo-600", btnTheme: "bg-purple-600 hover:bg-purple-500", badgeTheme: "bg-purple-500/10 text-purple-400 border-purple-500/25" },
            emerald: { iconGradient: "from-emerald-600 to-teal-600", btnTheme: "bg-emerald-600 hover:bg-emerald-500", badgeTheme: "bg-emerald-500/10 text-emerald-400 border-emerald-500/25" }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await loadSysConfig();
            await loadTargetMapData();
        });

        async function loadSysConfig() {
            try {
                const res = await fetch(`config/maps_index.json?v=${Date.now()}`);
                if (res.ok) sysConfig = await res.json();
            } catch (e) {
                sysConfig = { defaultMap: 'matsuri', maps: [{id: 'matsuri', name: '祭りマップ', icon: '🏮', hasCalendar: true, theme: themePresets.amber}] };
            }
            if (!currentMapID) currentMapID = sysConfig.defaultMap || 'matsuri';

            const selector = document.getElementById('mapSelector');
            selector.innerHTML = sysConfig.maps.map(m => `<option value="${m.id}" ${m.id === currentMapID ? 'selected' : ''}>${m.icon} ${m.name} (${m.id})</option>`).join('');
            document.getElementById('publicSiteLink').href = `viewer.html?map=${currentMapID}`;
        }

        async function switchTargetMap(mapId) {
            currentMapID = mapId;
            document.getElementById('publicSiteLink').href = `viewer.html?map=${mapId}`;
            await loadTargetMapData();
        }

        async function loadTargetMapData() {
            try {
                const res = await fetch(`data/${currentMapID}_data.json?v=${Date.now()}`);
                rawData = res.ok ? await res.json() : { spots: [], spotContentI18n: {} };
            } catch (e) { rawData = { spots: [], spotContentI18n: {} }; }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('adminTableBody');
            const spots = rawData.spots || [];
            if (spots.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">スポットがありません。「＋ スポット追加」から登録してください。</td></tr>`; return; }
            tbody.innerHTML = spots.map((spot, idx) => {
                const i18nObj = rawData.spotContentI18n?.[spot.id] || rawData.spotContentI18n?.[String(spot.id)] || {};
                const ja = i18nObj['ja'] || {};
                return `
                    <tr class="hover:bg-slate-800/40">
                        <td class="p-3 font-mono font-bold text-slate-300">#${idx + 1}</td>
                        <td class="p-3"><span class="text-[10px] px-2 py-0.5 rounded bg-amber-500/10 text-amber-400">${spot.category}</span></td>
                        <td class="p-3 font-bold text-white">${ja.title || '---'}</td>
                        <td class="p-3 text-slate-300">${ja.location || '---'}<div class="text-[10px] text-slate-500">${spot.startDate || ''}</div></td>
                        <td class="p-3 font-mono text-slate-400">${Number(spot.lat).toFixed(3)}, ${Number(spot.lng).toFixed(3)}</td>
                        <td class="p-3 font-mono text-slate-400">${spot.updatedAt || '---'}</td>
                        <td class="p-3 text-right space-x-1.5">
                            <button onclick="openSpotModalForEdit(${spot.id})" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs border border-slate-700">編集</button>
                            <button onclick="deleteSpot(${spot.id})" class="px-2.5 py-1 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded text-xs border border-red-500/30">削除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function translateText(text, targetLang) {
            if (!text || !text.trim()) return "";
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data[0]) return data[0].map(item => item[0]).join('');
            } catch (e) { console.error(e); }
            return text;
        }

        async function fetchCoordinatesFromAddress() {
            const address = document.getElementById('spotLocationJa').value.trim();
            const title = currentSpotTranslations['ja']?.title || document.getElementById('activeLangTitle').value.trim();
            const query = address || title;
            if (!query) { alert('先に「エリア / 場所」またはタイトルを入力してください。'); return; }
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`, {
                    headers: { 'Accept-Language': 'ja' }
                });
                const data = await res.json();
                if (data && data.length > 0) {
                    document.getElementById('spotLat').value = parseFloat(data[0].lat).toFixed(6);
                    document.getElementById('spotLng').value = parseFloat(data[0].lon).toFixed(6);
                } else {
                    alert('位置情報が見つかりませんでした。より具体的な地名を入力してください。');
                }
            } catch (e) {
                console.error(e);
                alert('位置情報の取得に失敗しました。');
            }
        }

        function openSpotModalForNew() {
            document.getElementById('spotModalTitle').innerText = "スポットの新規追加";
            document.getElementById('spotEditId').value = '';
            document.getElementById('spotCategory').value = currentMapID;
            document.getElementById('spotLat').value = '35.681234';
            document.getElementById('spotLng').value = '139.767123';
            document.getElementById('spotStartDate').value = '2027-05-01';
            document.getElementById('spotEndDate').value = '2027-05-01';
            document.getElementById('spotLocationJa').value = '';
            document.getElementById('spotPhotoBaseDir').value = `picture/${currentMapID}/`;
            
            currentSpotTranslations = {
                'ja': { title: '', location: '', desc: '' },
                'en': { title: '', location: '', desc: '' },
                'zh-TW': { title: '', location: '', desc: '' },
                'zh-CN': { title: '', location: '', desc: '' },
                'ko': { title: '', location: '', desc: '' },
                'th': { title: '', location: '', desc: '' },
                'id': { title: '', location: '', desc: '' }
            };
            currentSpotPhotos = [];
            renderPhotosList();
            switchLangTab('ja');
            document.getElementById('spotModal').classList.remove('hidden');
        }

function openSpotModalForEdit(spotId) {
    console.log("=== 編集対象 spotId:", spotId, "Type:", typeof spotId);
    console.log("=== 全 spotContentI18n:", rawData.spotContentI18n);

    const spot = (rawData.spots || []).find(s => String(s.id) === String(spotId));
    if (!spot) {
        console.error("スポットが見つかりません:", spotId);
        return;
    }

    document.getElementById('spotModalTitle').innerText = "スポットの編集 (#" + spotId + ")";
    document.getElementById('spotEditId').value = spotId;
    document.getElementById('spotCategory').value = spot.category || currentMapID;
    document.getElementById('spotLat').value = spot.lat || '';
    document.getElementById('spotLng').value = spot.lng || '';
    document.getElementById('spotStartDate').value = spot.startDate || '';
    document.getElementById('spotEndDate').value = spot.endDate || '';

    // 複数パターンのキー（数値・文字列）で確実にi18nデータを探索
    const rawI18n = rawData.spotContentI18n?.[spotId] 
                 || rawData.spotContentI18n?.[String(spotId)] 
                 || rawData.spotContentI18n?.[Number(spotId)] || {};

    console.log("取得できた rawI18n:", rawI18n);

    currentSpotTranslations = JSON.parse(JSON.stringify(rawI18n));

    // 各言語の入れ物が無い場合の安全な初期化
    ['ja', 'en', 'zh-TW', 'zh-CN', 'ko', 'th', 'id'].forEach(lang => {
        if (!currentSpotTranslations[lang]) {
            currentSpotTranslations[lang] = { title: '', location: '', desc: '' };
        }
    });

    // 日本語データを確実にフォームにセット
    const jaData = currentSpotTranslations['ja'];
    document.getElementById('spotLocationJa').value = jaData.location || '';
    document.getElementById('activeLangTitle').value = jaData.title || '';
    document.getElementById('activeLangLocation').value = jaData.location || '';
    document.getElementById('activeLangDesc').value = jaData.desc || '';

    currentSpotPhotos = JSON.parse(JSON.stringify(spot.photos || []));
    if (currentSpotPhotos.length > 0 && currentSpotPhotos[0].url) {
        const firstUrl = currentSpotPhotos[0].url;
        const lastSlashIdx = firstUrl.lastIndexOf('/');
        if (lastSlashIdx !== -1) {
            document.getElementById('spotPhotoBaseDir').value = firstUrl.substring(0, lastSlashIdx + 1);
            currentSpotPhotos.forEach(p => {
                if (p.url.startsWith(document.getElementById('spotPhotoBaseDir').value)) {
                    p.filename = p.url.substring(document.getElementById('spotPhotoBaseDir').value.length);
                } else {
                    p.filename = p.url;
                }
            });
        } else {
            document.getElementById('spotPhotoBaseDir').value = `picture/${currentMapID}/`;
            currentSpotPhotos.forEach(p => p.filename = p.url);
        }
    } else {
        document.getElementById('spotPhotoBaseDir').value = `picture/${currentMapID}/`;
    }

    renderPhotosList();
    switchLangTab('ja');
    document.getElementById('spotModal').classList.remove('hidden');
}
        function closeSpotModal() { document.getElementById('spotModal').classList.add('hidden'); }

        // --- 多言語タブ切り替え ＆ 手動修正同期 ---
        function switchLangTab(lang) {
            saveCurrentLangInput();
            currentActiveLang = lang;

            ['ja', 'en', 'zh-TW', 'zh-CN', 'ko', 'th', 'id'].forEach(l => {
                const btn = document.getElementById(`tab-btn-${l}`);
                if (!btn) return;
                if (l === lang) {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-t-xl bg-slate-900 text-white border-t border-x border-slate-700";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-medium rounded-t-xl text-slate-400 hover:text-white";
                }
            });

            document.getElementById('currentLangLabel').innerText = langNames[lang] || lang;
            const data = currentSpotTranslations[lang] || { title: '', location: '', desc: '' };
            document.getElementById('activeLangTitle').value = data.title || '';
            document.getElementById('activeLangLocation').value = data.location || '';
            document.getElementById('activeLangDesc').value = data.desc || '';
        }

        function saveCurrentLangInput() {
            if (!currentSpotTranslations[currentActiveLang]) {
                currentSpotTranslations[currentActiveLang] = {};
            }
            currentSpotTranslations[currentActiveLang].title = document.getElementById('activeLangTitle').value;
            currentSpotTranslations[currentActiveLang].location = document.getElementById('activeLangLocation').value;
            currentSpotTranslations[currentActiveLang].desc = document.getElementById('activeLangDesc').value;
            
            // 日本語タブのlocationが変更されたら上部のメイン入力欄にも同期する
            if (currentActiveLang === 'ja') {
                const locVal = document.getElementById('activeLangLocation').value;
                const locInput = document.getElementById('spotLocationJa');
                if (locInput) locInput.value = locVal;
            }
        }

        async function runAutoTranslate() {
            saveCurrentLangInput();
            const jaTitle = currentSpotTranslations['ja']?.title || '';
            const jaLoc = currentSpotTranslations['ja']?.location || document.getElementById('spotLocationJa').value || '';
            const jaDesc = currentSpotTranslations['ja']?.desc || '';

            if (!jaTitle) { alert('まずは日本語タブでタイトルを入力してください。'); return; }

            const btn = document.getElementById('translateSpotBtn');
            btn.innerText = "⏳ 翻訳中...";
            btn.disabled = true;

            currentSpotTranslations['ja'] = { title: jaTitle, location: jaLoc, desc: jaDesc };
            const langs = ["en", "zh-TW", "zh-CN", "ko", "th", "id"];
            for (const l of langs) {
                currentSpotTranslations[l] = {
                    title: await translateText(jaTitle, l),
                    location: await translateText(jaLoc, l),
                    desc: await translateText(jaDesc, l)
                };
            }

            btn.innerText = "✨ 日本語から全言語へ自動翻訳を実行";
            btn.disabled = false;
            switchLangTab(currentActiveLang);
            alert('全言語への自動翻訳が完了しました！各言語タブを開いて確認・手修正できます。');
        }

        // --- 写真・ファイル選択・ライセンス管理 ---
        function renderPhotosList() {
            const container = document.getElementById('photosContainer');
            if (currentSpotPhotos.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">写真が登録されていません。「＋ 写真を追加」から登録してください。</div>`;
                return;
            }
            container.innerHTML = currentSpotPhotos.map((p, idx) => `
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold text-slate-300">写真 #${idx + 1}</span>
                        <button type="button" onclick="removePhotoField(${idx})" class="text-red-400 hover:text-red-300 text-xs">削除</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
                        <div class="sm:col-span-5 flex gap-1">
                            <input type="text" placeholder="ファイル名 (例: pict1.jpg)" value="${p.filename || ''}" oninput="updatePhotoFilename(${idx}, this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono">
                            <input type="file" id="fileInput_${idx}" style="display:none" onchange="handleFileSelected(${idx}, event)">
                            <button type="button" onclick="document.getElementById('fileInput_${idx}').click()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg text-[11px] border border-slate-700 shrink-0" title="エクスプローラーからファイルを選択">📁 選択</button>
                        </div>
                        <div class="sm:col-span-4">
                            <input type="text" placeholder="キャプション" value="${p.caption || ''}" oninput="currentSpotPhotos[${idx}].caption = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        </div>
                        <div class="sm:col-span-3">
                            <input type="text" placeholder="ライセンス (例: CC BY)" value="${p.license || ''}" oninput="currentSpotPhotos[${idx}].license = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                        </div>
                    </div>
                    <div class="text-[10px] text-slate-500 font-mono truncate">生成URL: <span id="preview_url_${idx}">${p.url || ''}</span></div>
                </div>
            `).join('');
        }

        function addPhotoField() {
            currentSpotPhotos.push({ filename: '', caption: '', license: '', url: '' });
            renderPhotosList();
        }

        function removePhotoField(idx) {
            currentSpotPhotos.splice(idx, 1);
            renderPhotosList();
        }

        function updatePhotoFilename(idx, filename) {
            currentSpotPhotos[idx].filename = filename;
            const baseDir = document.getElementById('spotPhotoBaseDir').value.trim();
            currentSpotPhotos[idx].url = baseDir + filename;
            const preview = document.getElementById(`preview_url_${idx}`);
            if (preview) preview.innerText = currentSpotPhotos[idx].url;
        }

        function handleFileSelected(idx, event) {
            const file = event.target.files[0];
            if (file) {
                updatePhotoFilename(idx, file.name);
                renderPhotosList();
            }
        }

        function updateAllPhotoUrls() {
            const baseDir = document.getElementById('spotPhotoBaseDir').value.trim();
            currentSpotPhotos.forEach((p, idx) => {
                p.url = baseDir + (p.filename || '');
                const preview = document.getElementById(`preview_url_${idx}`);
                if (preview) preview.innerText = p.url;
            });
        }

        async function saveSpotData() {
            saveCurrentLangInput();
            updateAllPhotoUrls();
            const editId = document.getElementById('spotEditId').value;
            const category = document.getElementById('spotCategory').value.trim() || currentMapID;
            const lat = parseFloat(document.getElementById('spotLat').value);
            const lng = parseFloat(document.getElementById('spotLng').value);
            const startDate = document.getElementById('spotStartDate').value;
            const endDate = document.getElementById('spotEndDate').value || startDate;

            const jaTitle = currentSpotTranslations['ja']?.title || '';
            if (!jaTitle || isNaN(lat) || isNaN(lng)) {
                alert('日本語タイトル、緯度、経度は必須です。');
                return;
            }

            const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
            let spotId;

            if (editId) {
                spotId = Number(editId);
                const spot = rawData.spots.find(s => Number(s.id) === spotId);
                if (spot) {
                    spot.category = category;
                    spot.lat = lat;
                    spot.lng = lng;
                    spot.startDate = startDate;
                    spot.endDate = endDate;
                    spot.updatedAt = nowStr;
                    spot.photos = currentSpotPhotos.map(p => ({ url: p.url, caption: p.caption, license: p.license }));
                }
            } else {
                const maxId = rawData.spots.reduce((max, s) => Math.max(max, Number(s.id) || 0), 0);
                spotId = maxId + 1;
                const newSpot = {
                    id: spotId,
                    category: category,
                    lat: lat,
                    lng: lng,
                    startDate: startDate,
                    endDate: endDate,
                    updatedAt: nowStr,
                    photos: currentSpotPhotos.map(p => ({ url: p.url, caption: p.caption, license: p.license })),
                    links: []
                };
                rawData.spots.push(newSpot);
            }

            if (!rawData.spotContentI18n) rawData.spotContentI18n = {};
            rawData.spotContentI18n[spotId] = currentSpotTranslations;

            closeSpotModal();
            renderTable();
            exportDataFile();
            alert(`スポットデータを更新しました！\n自動ダウンロードされた \`${currentMapID}_data.json\` を data/ フォルダに保存してください。`);
        }

        function deleteSpot(spotId) {
            if (!confirm(`本当にスポット #${spotId} を削除しますか？`)) return;
            rawData.spots = rawData.spots.filter(s => Number(s.id) !== Number(spotId));
            if (rawData.spotContentI18n) delete rawData.spotContentI18n[spotId];
            renderTable();
            exportDataFile();
            alert(`スポットを削除しました。\`${currentMapID}_data.json\` をダウンロードして保存してください。`);
        }

        // --- マップ設定編集・新規マップ作成 ---
        async function openEditMapModal() {
            const currentMapObj = sysConfig.maps.find(m => m.id === currentMapID);
            if (!currentMapObj) return;

            document.getElementById('editTargetMapId').innerText = currentMapID;
            document.getElementById('editMapIdInput').value = currentMapID;
            document.getElementById('editMapNameInput').value = currentMapObj.name || '';
            document.getElementById('editMapIconInput').value = currentMapObj.icon || '';
            document.getElementById('editMapHasCalendar').checked = currentMapObj.hasCalendar !== false;

            try {
                const res = await fetch(`config/${currentMapID}_config.json?v=${Date.now()}`);
                if (res.ok) {
                    const cfg = await res.json();
                    const subJa = cfg.i18n?.ja?.subtitle || '';
                    const parts = subJa.split(' - ');
                    document.getElementById('editMapSubInput').value = parts.length > 1 ? parts.slice(1).join(' - ') : '';
                }
            } catch (e) { document.getElementById('editMapSubInput').value = ''; }

            let currentThemeKey = 'emerald';
            if (currentMapObj.theme?.btnTheme?.includes('amber')) currentThemeKey = 'amber';
            if (currentMapObj.theme?.btnTheme?.includes('purple')) currentThemeKey = 'purple';
            document.getElementById('editMapThemeSelect').value = currentThemeKey;

            editMapTranslations = {};
            document.getElementById('editMapTranslationStatus').classList.add('hidden');
            document.getElementById('editMapModal').classList.remove('hidden');
        }

        function closeEditMapModal() { document.getElementById('editMapModal').classList.add('hidden'); }

        async function autoTranslateEditMap() {
            const nameJa = document.getElementById('editMapNameInput').value.trim();
            const subJa = document.getElementById('editMapSubInput').value.trim();
            if (!nameJa) { alert('まずは「マップ名 (日本語)」を入力してください。'); return; }

            const btn = document.getElementById('translateEditMapBtn');
            btn.innerText = `⏳ 翻訳中...`;
            btn.disabled = true;

            editMapTranslations['ja'] = { title: nameJa, subtitle: subJa };
            const targetLangs = ["en", "zh-TW", "zh-CN", "ko", "th", "id"];
            for (const lang of targetLangs) {
                editMapTranslations[lang] = {
                    title: await translateText(nameJa, lang),

                };

        async function saveEditedMapSettings() {

            const subJa = document.getElementById('editMapSubInput').value.trim();

            const hasCalendar = document.getElementById('editMapHasCalendar').checked;

            if (Object.keys(editMapTranslations).length === 0) {
                editMapTranslations['ja'] = { title: nameJa, subtitle: subJa };
                const targetLangs = ["en", "zh-TW", "zh-CN", "ko", "th", "id"];
                for (const lang of targetLangs) {
                    editMapTranslations[lang] = {
                        title: await translateText(nameJa, lang),
                        subtitle: await translateText(subJa, lang)
                    };
                }
            }

            const target = sysConfig.maps.find(m => m.id === currentMapID);

                "zh-CN": { listTitle: "景点列表", consultTitle: "详细信息与咨询", consultDesc: "有关该景点的详细信息，请咨询当地观光协会等部门。" },

                th: { listTitle: "รายการสถานที่", consultTitle: "ข้อมูลเพิ่มเติมและติดต่อสอบถาม", consultDesc: "สำหรับข้อมูลเพิ่มเติมเกี่ยวกับสถานที่นี้ โปรดติดต่อสมาคมการท่องเที่ยวในท้องถิ่น" },
                id: { listTitle: "Daftar Lokasi", consultTitle: "Informasi Lebih Lanjut & Pertanyaan", consultDesc: "Silakan hubungi asosiasi pariwisata setempat untuk detail lebih lanjut." }

            langs.forEach(lang => {
                const trans = editMapTranslations[lang] || editMapTranslations['ja'];
                const st = staticI18n[lang] || staticI18n['ja'];
                i18nData[lang] = {
                    title: "Japan Discovery",
                    subtitle: trans.title + (trans.subtitle ? ` - ${trans.subtitle}` : ''),
                    listTitle: st.listTitle,
                    consultTitle: st.consultTitle,
                    consultDesc: st.consultDesc
                };
            });

            pendingEditFiles = {
                sysConfigStr: JSON.stringify(sysConfig, null, 2),
                configFilename: `${currentMapID}_config.json`,
                configStr: JSON.stringify({ "i18n": i18nData }, null, 2)
            };

            document.getElementById('edit-dl-btn-2').innerText = `${currentMapID}_config.json`;
            closeEditMapModal();
            document.getElementById('editMapDownloadModal').classList.remove('hidden');
        }

        function openNewMapModal() {
            document.getElementById('newMapId').value = '';
            document.getElementById('newMapIcon').value = '';
            document.getElementById('newMapTitleJa').value = '';
            document.getElementById('newMapSubJa').value = '';
            document.getElementById('newMapHasCalendar').checked = true;
            newMapTranslations = {};
            document.getElementById('newMapTranslationStatus').classList.add('hidden');
            document.getElementById('newMapFormArea').classList.remove('hidden');
            document.getElementById('newMapDownloadArea').classList.add('hidden');
            document.getElementById('newMapModal').classList.remove('hidden');
        }
        function closeNewMapModal() { document.getElementById('newMapModal').classList.add('hidden'); }

        async function autoTranslateNewMap() {
            const titleJa = document.getElementById('newMapTitleJa').value.trim();
            const subJa = document.getElementById('newMapSubJa').value.trim();
            if (!titleJa) { alert('まずは「マップ名 (日本語)」を入力してください。'); return; }

            const btn = document.getElementById('translateNewMapBtn');
            btn.innerText = `⏳ 翻訳中...`;
            btn.disabled = true;

            newMapTranslations['ja'] = { title: titleJa, subtitle: subJa };
            const targetLangs = ["en", "zh-TW", "zh-CN", "ko", "th", "id"];
            for (const lang of targetLangs) {
                newMapTranslations[lang] = {
                    title: await translateText(titleJa, lang),
                    subtitle: await translateText(subJa, lang)
                };
            }

            btn.innerText = `🌐 全言語へ自動翻訳`;
            btn.disabled = false;
            document.getElementById('newMapTranslationStatus').classList.remove('hidden');
        }

        function prepareNewMapFiles() {
            const mapId = document.getElementById('newMapId').value.trim().toLowerCase();
            const icon = document.getElementById('newMapIcon').value.trim();
            const nameJa = document.getElementById('newMapTitleJa').value.trim();
            const subJa = document.getElementById('newMapSubJa').value.trim();
            const hasCalendar = document.getElementById('newMapHasCalendar').checked;
            const themeKey = document.getElementById('newMapThemeSelect').value;

            if (!mapId || !nameJa || !icon) { alert("マップID、アイコン、マップ名は必須です。"); return; }

            if (Object.keys(newMapTranslations).length === 0) {
                newMapTranslations['ja'] = { title: nameJa, subtitle: subJa };
            }

            const newSysConfig = JSON.parse(JSON.stringify(sysConfig));
            newSysConfig.maps.push({ id: mapId, name: nameJa, icon, hasCalendar, theme: themePresets[themeKey] });

            const staticI18n = {
                ja: { listTitle: "スポット一覧", consultTitle: "詳細情報・お問い合わせ", consultDesc: "このスポットに関する詳しい情報は観光協会等へお問い合わせください。" },
                en: { listTitle: "Spot List", consultTitle: "Inquiries", consultDesc: "Please contact local tourist associations for more details." },
                "zh-TW": { listTitle: "景點列表", consultTitle: "詳細資訊與洽詢", consultDesc: "有關此景點的詳細資訊，請洽當地觀光協會等單位。" },
                "zh-CN": { listTitle: "景点列表", consultTitle: "详细信息与咨询", consultDesc: "有关该景点的详细信息，请咨询当地观光协会等部门。" },
                ko: { listTitle: "관광지 목록", consultTitle: "상세정보 및 문의", consultDesc: "이 관광지에 대한 자세한 정보는 관광 협회 등에 문의하십시오." },
                th: { listTitle: "รายการสถานที่", consultTitle: "ข้อมูลเพิ่มเติมและติดต่อสอบถาม", consultDesc: "สำหรับข้อมูลเพิ่มเติมเกี่ยวกับสถานที่นี้ โปรดติดต่อสมาคมการท่องเที่ยวในท้องถิ่น" },
                id: { listTitle: "Daftar Lokasi", consultTitle: "Informasi Lebih Lanjut & Pertanyaan", consultDesc: "Silakan hubungi asosiasi pariwisata setempat untuk detail lebih lanjut." }
            };

            const i18nData = {};
            const langs = ["ja", "en", "zh-TW", "zh-CN", "ko", "th", "id"];
            langs.forEach(lang => {
                const trans = newMapTranslations[lang] || newMapTranslations['ja'];
                const st = staticI18n[lang] || staticI18n['ja'];
                i18nData[lang] = {
                    title: "Japan Discovery",
                    subtitle: trans.title + (trans.subtitle ? ` - ${trans.subtitle}` : ''),
                    listTitle: st.listTitle,
                    consultTitle: st.consultTitle,
                    consultDesc: st.consultDesc
                };
            });

            pendingMapFiles = {
                mapId,
                sysConfigStr: JSON.stringify(newSysConfig, null, 2),
                configStr: JSON.stringify({ "i18n": i18nData }, null, 2),
                dataStr: JSON.stringify({ "spots": [], "spotContentI18n": {} }, null, 2)
            };

            document.getElementById('dl-btn-2').innerText = `${mapId}_config.json`;
            document.getElementById('dl-btn-3').innerText = `${mapId}_data.json`;
            document.getElementById('newMapFormArea').classList.add('hidden');
            document.getElementById('newMapDownloadArea').classList.remove('hidden');
        }

        function downloadMapFile(step) {
            if (step === 1) triggerDownload("maps_index.json", pendingMapFiles.sysConfigStr);
            if (step === 2) triggerDownload(`${pendingMapFiles.mapId}_config.json`, pendingMapFiles.configStr);
            if (step === 3) triggerDownload(`${pendingMapFiles.mapId}_data.json`, pendingMapFiles.dataStr);
        }

        function triggerDownload(filename, content) {
            const blob = new Blob([content], { type: 'text/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
        }

        function exportDataFile() {
            triggerDownload(`${currentMapID}_data.json`, JSON.stringify(rawData, null, 2));
        }
    </script>
