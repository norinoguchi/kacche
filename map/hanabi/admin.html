<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花火データ管理 - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🎆</span>
            <h1 class="text-lg font-bold">花火データ管理ダッシュボード (Hanabi Admin)</h1>
        </div>
        <a href="hanabi.html" class="text-xs bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-lg font-bold transition-colors">
            マップ画面を開く &rarr;
        </a>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h2 class="font-bold text-slate-800" id="data-count">登録花火大会一覧</h2>
                <span class="text-xs bg-purple-100 text-purple-700 font-bold px-2.5 py-1 rounded-full">Category: fireworks</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">花火大会名 (日本語)</th>
                            <th class="p-3">開催地</th>
                            <th class="p-3">季節</th>
                            <th class="p-3">開催日</th>
                            <th class="p-3">緯度 / 経度</th>
                            <th class="p-3">公式サイト</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-200">
                        <!-- Data Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function getSeasonTag(dateStr) {
            if (!dateStr) return '<span class="px-2 py-0.5 bg-yellow-100 text-yellow-700 rounded-full font-bold">夏</span>';
            const month = parseInt(dateStr.split('-')[1], 10);
            if (month >= 3 && month <= 5) return '<span class="px-2 py-0.5 bg-pink-100 text-pink-700 rounded-full font-bold">春</span>';
            if (month >= 6 && month <= 8) return '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full font-bold">夏</span>';
            if (month >= 9 && month <= 11) return '<span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full font-bold">秋</span>';
            return '<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-bold">冬</span>';
        }

        async function loadAdminData() {
            try {
                const res = await fetch('spots_data.json');
                const data = await res.json();

                const fireworksSpots = data.spots.filter(s => s.category === 'fireworks');
                document.getElementById('data-count').innerText = `登録花火大会一覧 (${fireworksSpots.length}件)`;

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                fireworksSpots.forEach(spot => {
                    const i18n = data.spotContentI18n[spot.id]?.ja || {};
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";

                    tr.innerHTML = `
                        <td class="p-3 font-mono font-bold text-slate-400">${spot.id}</td>
                        <td class="p-3 font-bold text-slate-900">${i18n.title || '名称未設定'}</td>
                        <td class="p-3">${i18n.location || '-'}</td>
                        <td class="p-3">${getSeasonTag(spot.startDate)}</td>
                        <td class="p-3 font-mono text-purple-700 font-bold">${spot.startDate}</td>
                        <td class="p-3 font-mono text-slate-500">${spot.lat.toFixed(4)}, ${spot.lng.toFixed(4)}</td>
                        <td class="p-3">
                            ${spot.links && spot.links.length > 0 ? `<a href="${spot.links[0].url}" target="_blank" class="text-purple-600 hover:underline">リンク</a>` : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Failed to load spots_data.json for admin:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
