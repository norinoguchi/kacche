    <!-- Multilingual & Slideshow Script -->
    <script>
        let portalData = {};
        let currentLang = 'en';

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentLang = urlParams.get('lang') || 'en';
            document.getElementById('langSelector').value = currentLang;

            try {
                // ポータルデータを外部JSONから取得
                const res = await fetch(`config/portal_index.json?v=${Date.now()}`);
                if (res.ok) {
                    portalData = await res.json();
                }
            } catch (e) {
                console.error("ポータルデータの読み込みに失敗しました", e);
            }

            renderPortal(currentLang);
        });

        function renderPortal(lang) {
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url);

            if (!portalData.hero) return;

            // 1. Heroセクションの更新
            const heroTexts = portalData.hero[lang] || portalData.hero['en'];
            document.getElementById('hero-tag').innerText = heroTexts.tag;
            document.getElementById('hero-title').innerText = heroTexts.title;
            document.getElementById('hero-desc').innerText = heroTexts.desc;

            // 2. カード一覧の動的生成
            const mapGrid = document.getElementById('mapGrid');
            mapGrid.innerHTML = ''; // 再描画のためクリア

            const sortedCards = (portalData.cards || []).sort((a, b) => a.order - b.order);

            sortedCards.forEach(card => {
                const t = card.i18n[lang] || card.i18n['en'];
                const isComingSoon = card.status === 'coming_soon';
                
                const Tag = isComingSoon ? 'div' : 'a';
                const hrefAttr = isComingSoon ? '' : `href="${card.link}&lang=${lang}"`;
                const styleClasses = isComingSoon 
                    ? 'bg-white/80 opacity-85 hover:opacity-100' 
                    : 'bg-white border-slate-200/90 hover:border-blue-500/60 shadow-md hover:shadow-xl card-hover';
                
                const imagesHtml = card.images.map((img, idx) => 
                    `<img src="${img}" class="slideshow-img absolute inset-0 w-full h-full object-cover ${idx === 0 ? 'opacity-100' : 'opacity-0'}">`
                ).join('');

                const cardHtml = `

        function changeLanguage(lang) {
            document.getElementById('langSelector').value = lang;
            renderPortal(lang);
        }

        function initSlideshows() {
            const containers = document.querySelectorAll('.slideshow-container');
            containers.forEach(container => {
                const imgElements = container.querySelectorAll('.slideshow-img');
                if (imgElements.length > 1 && !container.dataset.initialized) {
                    container.dataset.initialized = "true";
                    let currentIndex = 0;
                    setInterval(() => {
                        imgElements[currentIndex].classList.remove('opacity-100');
                        imgElements[currentIndex].classList.add('opacity-0');
                        currentIndex = (currentIndex + 1) % imgElements.length;
                        imgElements[currentIndex].classList.remove('opacity-0');
                        imgElements[currentIndex].classList.add('opacity-100');
                    }, 4500);
                }
            });
        }
