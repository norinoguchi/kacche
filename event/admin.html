<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Discovery Hub - 管理者CMSコンソール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slateDark: '#0b0f19',
                        slateCard: '#131c2e',
                        accentBlue: '#3b82f6',
                        accentGold: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <!-- Inter & Noto Sans JP Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slateDark text-slate-100 h-full flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slateCard/80 backdrop-blur-md border-b border-slate-800 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 shrink-0">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    Japan Discovery Hub 
                    <span class="hidden sm:inline-block text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-normal">Admin CMS</span>
                </h1>
                <p class="text-[11px] sm:text-xs text-slate-400">スポット管理 ＆ 多言語データ最適化</p>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
            <a href="japan_discovery_platform.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5 border border-slate-700">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <span class="hidden sm:inline">公開サイトを確認</span>
                <span class="sm:hidden">確認</span>
            </a>
            <button onclick="openEditorModalForNew()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium shadow-lg shadow-blue-600/20 transition-all flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>新規追加</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-7xl mx-auto w-full">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-6">
            <div>
                <h2 class="text-sm sm:text-base font-bold text-white">登録スポット一覧（多言語データ管理）</h2>
                <p class="text-[11px] sm:text-xs text-slate-400">各言語タブから個別のタイトルや説明文をチューニングできます。</p>
            </div>
            <div class="text-xs font-mono text-slate-400 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 self-start sm:self-auto" id="totalCount">総登録数: 0件</div>
        </div>

        <div class="bg-slateCard/60 border border-slate-800 rounded-2xl overflow-x-auto shadow-xl">
            <table class="w-full text-left border-collapse min-w-[600px]">
                <thead>
                    <tr class="bg-slate-900/90 text-xs text-slate-400 border-b border-slate-800 font-semibold">
                        <th class="p-3 sm:p-4">カテゴリー</th>
                        <th class="p-3 sm:p-4">タイトル (日本語ベース)</th>
                        <th class="p-3 sm:p-4">エリア・開催日</th>
                        <th class="p-3 sm:p-4 text-right">アクション</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-slate-800/60 text-xs">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Multilingual Edit Modal -->
    <div id="editModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="bg-slateCard border border-slate-700/80 rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="px-5 sm:px-6 py-4 border-b border-slate-800 flex items-center justify-between shrink-0">
                <h3 id="modalTitle" class="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    スポット詳細 ＆ 多言語コンテンツ編集
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 sm:p-6 overflow-y-auto space-y-5 flex-1">
                <!-- Basic Info & Geo Tools -->
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h4 class="text-xs font-bold text-blue-400 uppercase tracking-wider">共通メタデータ</h4>
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="autoTranslateAll()" id="translateBtn" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white px-3 py-1 rounded-lg text-[11px] font-medium transition-all border border-indigo-500/30 flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                                🌐 日本語から全言語へ自動翻訳
                            </button>
                            <button type="button" onclick="autoFetchCoordinates()" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white px-3 py-1 rounded-lg text-[11px] font-medium transition-all border border-emerald-500/30 flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                📍 住所から緯度経度取得
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-300 mb-1">カテゴリー</label>
                            <select id="editCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                                <option value="fireworks">🎆 花火・祭り</option>
                                <option value="tourism">⛩️ 観光・体験</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-300 mb-1">開催日 / 日付</label>
                            <input type="date" id="editDate" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-300 mb-1">緯度</label>
                                <input type="number" step="any" id="editLat" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-300 mb-1">経度</label>
                                <input type="number" step="any" id="editLng" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Language Tabs -->
                <div>
                    <h4 class="text-xs font-bold text-slate-300 mb-2">言語別コンテンツ</h4>
                    <div id="langTabs" class="flex flex-wrap gap-1.5 border-b border-slate-800 pb-3"></div>
                </div>

                <!-- Active Language Content Form -->
                <div class="space-y-3.5 bg-slate-900/40 p-4 rounded-xl border border-slate-800/80">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">タイトル / 名称 (<span id="activeLangLabel">日本語</span>)</label>
                        <input type="text" id="langTitle" placeholder="スポット名を入力..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">エリア / 地域名 (<span id="activeLangLabel2">日本語</span>)</label>
                        <input type="text" id="langLocation" placeholder="例：新潟県長岡市..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">詳細説明・魅力 (<span id="activeLangLabel3">日本語</span>)</label>
                        <textarea id="langDesc" rows="3" placeholder="詳細な説明文を入力..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="bg-slate-900/80 px-5 sm:px-6 py-3.5 border-t border-slate-800 flex justify-between items-center shrink-0">
                <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium">キャンセル</button>
                <button type="button" onclick="saveSpotData()" class="px-5 sm:px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium shadow-lg shadow-blue-600/20">変更を保存する</button>
            </div>
        </div>
    </div>

    <!-- Management Script -->
    <script>
        const langMap = {
            ja: "🇯🇵 日本語",
            en: "🇺🇸 English",
            "zh-TW": "🇹🇼 繁體中文",
            "zh-CN": "🇨🇳 简体中文",
            ko: "🇰🇷 한국어",
            th: "🇹🇭 ไทย",
            id: "🇮🇩 Bahasa Indonesia"
        };

        const defaultSpots = [
            { id: 1, category: 'fireworks', date: '2026-08-02', lat: 37.4475, lng: 138.8511 },
            { id: 2, category: 'fireworks', date: '2026-08-29', lat: 39.4542, lng: 140.4731 },
            { id: 3, category: 'fireworks', date: '2026-07-17', lat: 35.0037, lng: 135.7600 },
            { id: 4, category: 'tourism', date: '2026-08-10', lat: 36.2560, lng: 136.9066 },
            { id: 5, category: 'tourism', date: '2026-09-15', lat: 33.7042, lng: 135.7765 },
            { id: 6, category: 'fireworks', date: '2026-08-05', lat: 40.8244, lng: 140.7400 }
        ];

        let spots = JSON.parse(localStorage.getItem('japan_discovery_spots')) || defaultSpots;
        let spotContentI18n = JSON.parse(localStorage.getItem('japan_discovery_spot_i18n')) || {
            1: {
                ja: { title: "長岡まつり大花火大会", location: "新潟県長岡市", desc: "日本三大花火の一つ。信濃川を舞台に圧倒的なスケールで繰り広げられる正三尺玉やフェニックスは必見。" },
                en: { title: "Nagaoka Fireworks Festival", location: "Nagaoka City, Niigata", desc: "One of Japan's top three fireworks festivals." }
            }
        };

        let editingSpotId = null;
        let activeLang = 'ja';
        let currentEditingData = {};

        window.addEventListener('DOMContentLoaded', () => {
            renderTable();
            renderLangTabs();
        });

        function renderTable() {
            const tbody = document.getElementById('adminTableBody');
            document.getElementById('totalCount').innerText = `総登録数: ${spots.length}件`;

            if (spots.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-500">登録されているスポットはありません。</td></tr>`;
                return;
            }

            tbody.innerHTML = spots.map(spot => {
                const i18nData = spotContentI18n[spot.id] || {};
                const jaData = i18nData['ja'] || { title: '(タイトル未設定)', location: '(エリア未設定)' };
                const isFw = spot.category === 'fireworks';

                return `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 sm:p-4">
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${isFw ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
                                ${isFw ? '🎆 花火' : '⛩️ 観光'}
                            </span>
                            <div class="text-[9px] font-mono text-slate-500 mt-1">ID: ${spot.id}</div>
                        </td>
                        <td class="p-3 sm:p-4 font-bold text-white">${jaData.title}</td>
                        <td class="p-3 sm:p-4 text-slate-300">
                            <div>${jaData.location}</div>
                            <div class="text-[11px] font-mono text-slate-500">${spot.date}</div>
                        </td>
                        <td class="p-3 sm:p-4 text-right space-x-1 sm:space-x-2 whitespace-nowrap">
                            <button onclick="openEditorModal(${spot.id})" class="px-2.5 sm:px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white rounded-lg text-xs font-medium transition-all border border-blue-500/30">
                                編集
                            </button>
                            <button onclick="deleteSpot(${spot.id})" class="px-2.5 sm:px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-xs font-medium transition-all border border-red-500/30">
                                削除
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderLangTabs() {
            const container = document.getElementById('langTabs');
            container.innerHTML = Object.keys(langMap).map(langKey => {
                const isActive = langKey === activeLang;
                return `
                    <button type="button" onclick="switchActiveLang('${langKey}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium transition-all ${isActive ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}">
                        ${langMap[langKey]}
                    </button>
                `;
            }).join('');

            document.getElementById('activeLangLabel').innerText = langMap[activeLang];
            document.getElementById('activeLangLabel2').innerText = langMap[activeLang];
            document.getElementById('activeLangLabel3').innerText = langMap[activeLang];
        }

        function switchActiveLang(langKey) {
            saveCurrentLangFormToMemory();
            activeLang = langKey;
            renderLangTabs();
            loadLangFormFromMemory();
        }

        function openEditorModalForNew() {
            editingSpotId = Date.now();
            activeLang = 'ja';
            currentEditingData = {
                category: 'fireworks',
                date: '2026-08-01',
                lat: 35.6812,
                lng: 139.7671,
                i18n: {}
            };
            populateModalForm();
            document.getElementById('editModal').classList.remove('hidden');
        }

        function openEditorModal(id) {
            editingSpotId = id;
            activeLang = 'ja';
            const spot = spots.find(s => s.id === id);
            currentEditingData = {
                category: spot.category,
                date: spot.date,
                lat: spot.lat,
                lng: spot.lng,
                i18n: JSON.parse(JSON.stringify(spotContentI18n[id] || {}))
            };
            populateModalForm();
            document.getElementById('editModal').classList.remove('hidden');
        }

        function populateModalForm() {
            document.getElementById('editCategory').value = currentEditingData.category;
            document.getElementById('editDate').value = currentEditingData.date;
            document.getElementById('editLat').value = currentEditingData.lat;
            document.getElementById('editLng').value = currentEditingData.lng;
            renderLangTabs();
            loadLangFormFromMemory();
        }

        function loadLangFormFromMemory() {
            const langData = currentEditingData.i18n[activeLang] || { title: '', location: '', desc: '' };
            document.getElementById('langTitle').value = langData.title || '';
            document.getElementById('langLocation').value = langData.location || '';
            document.getElementById('langDesc').value = langData.desc || '';
        }

        function saveCurrentLangFormToMemory() {
            if (!currentEditingData.i18n[activeLang]) {
                currentEditingData.i18n[activeLang] = {};
            }
            currentEditingData.i18n[activeLang].title = document.getElementById('langTitle').value;
            currentEditingData.i18n[activeLang].location = document.getElementById('langLocation').value;
            currentEditingData.i18n[activeLang].desc = document.getElementById('langDesc').value;
        }

        async function translateText(text, targetLang) {
            if (!text || !text.trim()) return "";
            let gLang = targetLang;
            if (targetLang === "zh-TW") gLang = "zh-TW";
            if (targetLang === "zh-CN") gLang = "zh-CN";

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=${gLang}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data[0]) {
                    return data[0].map(item => item[0]).join('');
                }
            } catch (e) {
                console.error("Translation error:", e);
            }
            return text;
        }

        async function autoTranslateAll() {
            saveCurrentLangFormToMemory();
            
            const jaData = currentEditingData.i18n['ja'];
            if (!jaData || (!jaData.title && !jaData.desc)) {
                alert('まずは「日本語」タブにタイトルや説明文を入力してください。');
                return;
            }

            const btn = document.getElementById('translateBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `⏳ 翻訳中...`;
            btn.disabled = true;

            const targetLangs = ["en", "zh-TW", "zh-CN", "ko", "th", "id"];

            for (const lang of targetLangs) {
                if (!currentEditingData.i18n[lang]) {
                    currentEditingData.i18n[lang] = {};
                }
                const translatedTitle = await translateText(jaData.title || "", lang);
                const translatedLocation = await translateText(jaData.location || "", lang);
                const translatedDesc = await translateText(jaData.desc || "", lang);

                currentEditingData.i18n[lang].title = translatedTitle;
                currentEditingData.i18n[lang].location = translatedLocation;
                currentEditingData.i18n[lang].desc = translatedDesc;
            }

            btn.innerHTML = originalText;
            btn.disabled = false;

            loadLangFormFromMemory();
            alert('日本語をベースに、全言語への自動翻訳が完了しました！各タブを開いて確認・微調整できます。');
        }

        async function autoFetchCoordinates() {
            saveCurrentLangFormToMemory();
            const locationInput = document.getElementById('langLocation').value || (currentEditingData.i18n['ja'] && currentEditingData.i18n['ja'].location);
            
            if (!locationInput) {
                alert('先に「エリア / 地域名」欄に住所や地域名を入力してください。');
                return;
            }

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationInput)}`);
                const results = await response.json();
                
                if (results && results.length > 0) {
                    const lat = parseFloat(results[0].lat);
                    const lng = parseFloat(results[0].lon);
                    
                    document.getElementById('editLat').value = lat;
                    document.getElementById('editLng').value = lng;
                    currentEditingData.lat = lat;
                    currentEditingData.lng = lng;
                    
                    alert(`「${locationInput}」の座標を自動取得しました！\n緯度: ${lat}, 経度: ${lng}`);
                } else {
                    alert('該当する場所が見つかりませんでした。');
                }
            } catch (error) {
                console.error(error);
                alert('座標の取得に失敗しました。');
            }
        }

        function saveSpotData() {
            saveCurrentLangFormToMemory();

            const category = document.getElementById('editCategory').value;
            const date = document.getElementById('editDate').value;
            const lat = parseFloat(document.getElementById('editLat').value);
            const lng = parseFloat(document.getElementById('editLng').value);

            if (!date || isNaN(lat) || isNaN(lng)) {
                alert('開催日、緯度、経度を正しく入力してください。');
                return;
            }

            let spotIndex = spots.findIndex(s => s.id === editingSpotId);
            if (spotIndex >= 0) {
                spots[spotIndex].category = category;
                spots[spotIndex].date = date;
                spots[spotIndex].lat = lat;
                spots[spotIndex].lng = lng;
            } else {
                spots.push({ id: editingSpotId, category, date, lat, lng });
            }

            spotContentI18n[editingSpotId] = currentEditingData.i18n;

            localStorage.setItem('japan_discovery_spots', JSON.stringify(spots));
            localStorage.setItem('japan_discovery_spot_i18n', JSON.stringify(spotContentI18n));

            closeEditModal();
            renderTable();
            alert('スポット情報を保存しました！公開サイトに即座に反映されます。');
        }

        function deleteSpot(id) {
            if (!confirm('本当にこのスポットを削除しますか？')) return;
            spots = spots.filter(s => s.id !== id);
            delete spotContentI18n[id];

            localStorage.setItem('japan_discovery_spots', JSON.stringify(spots));
            localStorage.setItem('japan_discovery_spot_i18n', JSON.stringify(spotContentI18n));
            renderTable();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }
    </script>
</body>
</html>
